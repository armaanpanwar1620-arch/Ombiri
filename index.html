<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHOR // OS - Sovereign Voice Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020813;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px;
            overflow: hidden;
            position: relative;
        }

        /* Stark Holographic Scanlines */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* Header HUD */
        .hud-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 12px;
            z-index: 20;
        }

        .sys-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f0ff;
        }

        .sys-title span {
            display: block;
            font-size: 0.75rem;
            color: #88ccff;
            font-weight: normal;
        }

        .status-badge {
            font-size: 0.75rem;
            color: #ffffff;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            padding: 4px 10px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Arc Reactor Core */
        .hologram-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            z-index: 20;
        }

        .outer-ring {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 2px dashed #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            animation: rotateClockwise 12s infinite linear;
        }

        .middle-ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-top: 2px solid #00f0ff;
            animation: rotateCounter 6s infinite linear;
        }

        .core-orb {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff 0%, rgba(2, 8, 19, 0.9) 75%);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 35px #00f0ff, inset 0 0 20px #00f0ff;
            animation: corePulse 2.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes corePulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #00f0ff; }
            50% { transform: scale(1.08); box-shadow: 0 0 45px #00f0ff, inset 0 0 30px #00f0ff; }
            100% { transform: scale(1); box-shadow: 0 0 20px #00f0ff; }
        }

        /* Sound Wave Bar Visualizer */
        .wave-box {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            margin-bottom: 15px;
            z-index: 20;
        }

        .bar {
            width: 4px;
            height: 8px;
            background-color: #00f0ff;
            border-radius: 2px;
            box-shadow: 0 0 8px #00f0ff;
            transition: height 0.1s ease;
        }

        .wave-box.active .bar {
            animation: barPulse 0.6s infinite ease-in-out alternate;
        }

        .wave-box.active .bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-box.active .bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-box.active .bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-box.active .bar:nth-child(4) { animation-delay: 0.4s; }
        .wave-box.active .bar:nth-child(5) { animation-delay: 0.15s; }

        @keyframes barPulse {
            0% { height: 8px; }
            100% { height: 28px; }
        }

        /* Response Card & Controls */
        .response-card {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 15, 30, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 18px;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 20;
        }

        .user-text {
            color: #88ccff;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-style: italic;
        }

        .aethor-text {
            color: #ffffff;
            font-size: 1.05rem;
            line-height: 1.4;
            text-shadow: 0 0 5px #00f0ff;
            margin-bottom: 15px;
        }

        .talk-btn {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.2s ease;
        }

        .talk-btn:active {
            transform: scale(0.96);
            background: rgba(0, 240, 255, 0.4);
        }

        /* Tap Overlay for Browser Audio Permission */
        .tap-prompt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 19, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }

        .tap-prompt h2 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00f0ff;
        }

        .tap-prompt p {
            color: #88ccff;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="tap-prompt" id="tapOverlay" onclick="initializeVoiceSystem()">
        <h2>INITIALIZE AETHOR CORE</h2>
        <p>[ TAP ANYWHERE TO START ]</p>
    </div>

    <div class="hud-header">
        <div class="sys-title">
            AETHOR // OS
            <span>BOSS: ARMAAN</span>
        </div>
        <div class="status-badge" id="statusBadge">LISTENING...</div>
    </div>

    <div class="hologram-container">
        <div class="outer-ring"></div>
        <div class="middle-ring"></div>
        <div class="core-orb">🧠</div>
    </div>

    <div class="wave-box active" id="waveBox">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="response-card">
        <div class="user-text" id="userQuery">Standing by for speech...</div>
        <div class="aethor-text" id="aethorReply">Aethor online, Armaan. I'm ready whenever you are.</div>
        <button class="talk-btn" onclick="triggerManualListening()">🎙️ TAP TO TALK NOW</button>
    </div>

    <script>
        let recognition;
        let isSpeaking = false;

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            }).catch(err => console.log("Mic noise suppression active."));
        }

        function initializeVoiceSystem() {
            document.getElementById('tapOverlay').style.display = 'none';
            speakOutLoud("Greetings Armaan. All systems online. Aapki kya madad karoon?");
            setupSpeechRecognition();
        }

        function speakOutLoud(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            const jarvisVoice = voices.find(v => v.lang.includes('hi-IN') || v.lang.includes('en-IN') || v.lang.includes('en-GB'));
            if (jarvisVoice) speech.voice = jarvisVoice;

            speech.rate = 0.95; 
            speech.pitch = 0.85;
            speech.volume = 1.0;

            const statusBadge = document.getElementById('statusBadge');
            const waveBox = document.getElementById('waveBox');

            speech.onstart = () => {
                isSpeaking = true;
                statusBadge.innerText = "SPEAKING...";
                statusBadge.style.borderColor = "#00ffcc";
                waveBox.classList.add('active');
            };

            speech.onend = () => {
                isSpeaking = false;
                statusBadge.innerText = "LISTENING...";
                statusBadge.style.borderColor = "#00f0ff";
                startListeningLoop();
            };

            window.speechSynthesis.speak(speech);
        }

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                document.getElementById('aethorReply').innerText = "Please open this file in Google Chrome.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN';

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('userQuery').innerText = `Armaan: "${speechResult}"`;
                processAethorLogic(speechResult);
            };

            recognition.onerror = function(event) {
                if (!isSpeaking) {
                    setTimeout(startListeningLoop, 1200);
                }
            };

            recognition.onend = function() {
                if (!isSpeaking) {
                    startListeningLoop();
                }
            };

            startListeningLoop();
        }

        function startListeningLoop() {
            try {
                if (recognition && !isSpeaking) {
                    recognition.start();
                }
            } catch(e) {}
        }

        function triggerManualListening() {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            try {
                recognition.start();
                document.getElementById('statusBadge').innerText = "LISTENING NOW...";
            } catch(e) {}
        }

        function processAethorLogic(input) {
            const query = input.toLowerCase();
            let reply = "";

            if (query.includes("kaise ho") || query.includes("how are you")) {
                reply = "Main bilkul badhiya hoon, Armaan. Aap batayein, aaj kya build karna hai?";
            } else if (query.includes("boss") || query.includes("who is your boss") || query.includes("boss kaun hai")) {
                reply = "Mera boss aur creator Armaan hai. Main hamesha aapke orders ke liye ready hoon.";
            } else if (query.includes("kya kar sakte ho") || query.includes("what can you do") || query.includes("capabilities")) {
                reply = "Main aapki voice ko bilingual samajh sakta hoon, Jarvis tone me baat kar sakta hoon, aur coding queries solve kar sakta hoon, Armaan.";
            } else if (query.includes("hello") || query.includes("hi") || query.includes("namaste") || query.includes("hey")) {
                reply = "Greetings Armaan. All holographic systems are running optimal. Kaise help karoon aapki?";
            } else if (query.includes("code") || query.includes("python") || query.includes("c language")) {
                reply = "Code structure ready hai, Boss. Python backend ho ya C language, jo bologe woh setup karenge.";
            } else {
                reply = `Samajh gaya, Armaan. Aapne kaha: "${input}". Main ispe kaam kar raha hoon.`;
            }

            document.getElementById('aethorReply').innerText = reply;
            speakOutLoud(reply);
        }

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
