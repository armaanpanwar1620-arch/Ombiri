<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombiri | Secure Chat</title>
    <!-- Firebase SDKs for real-time saving and sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #AA7C11;
            --black: #000000;
            --dark-grey: #121212;
            --light-grey: #1E1E1E;
            --border-color: #333333;
            --text-gold: #F3E5AB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--black);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-card {
            background: var(--dark-grey);
            border: 1px solid var(--gold);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
        }

        .login-card h1 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .login-card p.credits {
            color: var(--dark-gold);
            font-size: 0.85rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--text-gold);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            background: var(--light-grey);
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            border-color: var(--gold);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: var(--black);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Main App Layout */
        #app-screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: row;
        }

        .sidebar {
            width: 260px;
            background: var(--dark-grey);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            color: var(--gold);
            font-size: 1.1rem;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .room-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-gold);
            margin-bottom: 5px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .room-item:hover, .room-item.active {
            background: var(--light-grey);
            color: var(--gold);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--black);
        }

        header {
            background: var(--dark-grey);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h3 {
            color: var(--gold);
            font-size: 1.1rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.incoming {
            background: var(--dark-grey);
            color: #ffffff;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .message.outgoing {
            background: var(--gold);
            color: var(--black);
            align-self: flex-end;
            font-weight: 500;
        }

        .message .sender {
            font-size: 0.75rem;
            color: var(--dark-gold);
            margin-bottom: 3px;
            font-weight: 600;
        }

        .message.outgoing .sender {
            color: #4a3b08;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        .message audio {
            width: 220px;
            height: 35px;
            margin-top: 5px;
        }

        .input-bar {
            padding: 15px 20px;
            background: var(--dark-grey);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-bar input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background: var(--light-grey);
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
        }

        .input-bar input[type="text"]:focus {
            border-color: var(--gold);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-bar button.send-btn {
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        @media(max-width: 768px) {
            .sidebar { display: none; } /* Simplified mobile view */
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h1>OMBIRI</h1>
            <p class="credits">Secure Private Chat</p>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your name" autocomplete="off">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="off">
            </div>

            <button class="btn" onclick="attemptLogin()">Start Chatting</button>
            <div id="error" class="error-msg">Incorrect username or password!</div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Rooms</h2>
            </div>
            <div class="room-list">
                <div class="room-item active" onclick="switchRoom('public')">🌐 Public Lobby</div>
                <div class="room-item" onclick="createNewPrivateRoom()">➕ New Private Room</div>
            </div>
        </div>

        <div class="chat-main">
            <header>
                <h3 id="current-room-title">Public Lobby</h3>
                <div>
                    <span id="display-user" style="margin-right: 15px; font-size: 0.85rem; color: var(--text-gold);"></span>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </header>

            <div class="messages-area" id="messages"></div>

            <div class="input-bar">
                <label class="icon-btn" title="Attach Image">
                    📁<input type="file" id="image-input" accept="image/*" style="display:none;" onchange="sendImage(event)">
                </label>
                <button class="icon-btn" id="mic-btn" onclick="toggleVoiceRecord()" title="Record Voice Note">🎙️</button>
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // REPLACE with your free Firebase project config if you want permanent cloud storage sync across friends
        const firebaseConfig = {
            databaseURL: "https://ombiri-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CORRECT_PASS = "123456";
        let currentRoom = "public";
        let mediaRecorder;
        let audioChunks = [];

        // Check persistent login on load
        window.onload = function() {
            const savedUser = localStorage.getItem('ombiri_username');
            if (savedUser) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('display-user').innerText = "User: " + savedUser;
                listenToMessages();
            }
        };

        function attemptLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error');

            if (user !== "" && pass === CORRECT_PASS) {
                localStorage.setItem('ombiri_username', user);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('display-user').innerText = "User: " + user;
                listenToMessages();
            } else {
                errorDiv.style.display = 'block';
                errorDiv.innerText = pass !== CORRECT_PASS ? "Incorrect password! Use 123456" : "Enter a username!";
            }
        }

        function logout() {
            localStorage.removeItem('ombiri_username');
            location.reload();
        }

        function switchRoom(roomName) {
            currentRoom = roomName;
            document.getElementById('current-room-title').innerText = roomName === 'public' ? 'Public Lobby' : `Private Room: ${roomName}`;
            listenToMessages();
        }

        function createNewPrivateRoom() {
            const roomName = prompt("Enter private room name:");
            if (roomName) {
                switchRoom(roomName.trim());
            }
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            const user = localStorage.getItem('ombiri_username');

            if (text === "") return;

            db.ref('chats/' + currentRoom).push({
                sender: user,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });

            input.value = "";
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const user = localStorage.getItem('ombiri_username');
                db.ref('chats/' + currentRoom).push({
                    sender: user,
                    fileData: e.target.result,
                    type: 'image',
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        function toggleVoiceRecord() {
            const micBtn = document.getElementById('mic-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const user = localStorage.getItem('ombiri_username');
                            db.ref('chats/' + currentRoom).push({
                                sender: user,
                                fileData: e.target.result,
                                type: 'audio',
                                timestamp: Date.now()
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                    mediaRecorder.start();
                    micBtn.style.color = "#ff4d4d";
                    micBtn.title = "Recording... Tap to Stop";
                }).catch(err => alert("Microphone access blocked or unavailable."));
            } else {
                mediaRecorder.stop();
                micBtn.style.color = "var(--gold)";
                micBtn.title = "Record Voice Note";
            }
        }

        function listenToMessages() {
            const messagesArea = document.getElementById('messages');
            db.ref('chats/' + currentRoom).on('value', snapshot => {
                messagesArea.innerHTML = "";
                snapshot.forEach(childSnapshot => {
                    const msg = childSnapshot.val();
                    const user = localStorage.getItem('ombiri_username');
                    const isOutgoing = msg.sender === user;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
                    
                    let content = `<div class="sender">${msg.sender}</div>`;
                    if (msg.type === 'text') {
                        content += escapeHtml(msg.text);
                    } else if (msg.type === 'image') {
                        content += `<img src="${msg.fileData}" alt="attachment">`;
                    } else if (msg.type === 'audio') {
                        content += `<audio controls src="${msg.fileData}"></audio>`;
                    }

                    msgDiv.innerHTML = content;
                    messagesArea.appendChild(msgDiv);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
