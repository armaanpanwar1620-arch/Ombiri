<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ombiri - Secure Chat</title>
    
    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        /* Header Bar */
        header {
            padding: 10px 15px;
            background-color: #121212;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            color: #D4AF37;
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }
        .header-actions { display: flex; gap: 8px; }
        .btn-small {
            background: #222;
            color: #ccc;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-small.danger { color: #ff4b4b; }
        
        /* Navigation / Rooms Switcher */
        .nav-bar {
            display: flex;
            background-color: #161616;
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid #222;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .nav-btn {
            background: #222;
            color: #ccc;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .nav-btn.active {
            background: #D4AF37;
            color: #000;
            font-weight: bold;
        }
        
        /* Chat Messages Area */
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #000000;
        }
        .message-card {
            background-color: #121212;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            max-width: 85%;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-card.me {
            background-color: #1f1f1f;
            border-color: #D4AF37;
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #444;
            flex-shrink: 0;
        }
        .msg-body { flex: 1; }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .sender-name {
            font-size: 0.82rem;
            font-weight: bold;
            color: #00adb5;
        }
        .message-card.me .sender-name { color: #D4AF37; }
        .timestamp { font-size: 0.68rem; color: #777; }
        .message-text { font-size: 0.92rem; color: #fff; word-break: break-word; margin-top: 2px; }
        .message-image { max-width: 100%; border-radius: 8px; margin-top: 6px; }
        .delete-btn {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 0.75rem;
            float: right;
            margin-top: 4px;
        }
        
        /* Footer Controls */
        .chat-footer {
            padding: 10px;
            background-color: #121212;
            border-top: 1px solid #222;
            flex-shrink: 0;
        }
        .input-form { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"], input[type="password"] {
            flex: 1;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #D4AF37; }
        .send-btn {
            background-color: #D4AF37;
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            height: 42px;
        }
        .file-label {
            background: #222;
            color: #D4AF37;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Screens & Modals */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #121212;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-box h2 { color: #D4AF37; text-align: center; }
        .dp-preview {
            width: 70px; height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto;
            border: 2px solid #D4AF37;
        }
    </style>
</head>
<body>

    <!-- 1. Login / Registration Screen -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2>🖤 OMBIRI</h2>
            <p style="font-size: 0.8rem; color: #888; text-align: center;">Sign In to Your Personal Account</p>
            <input type="text" id="username-input" placeholder="Unique Account Name">
            <input type="password" id="password-input" placeholder="Password">
            <button class="send-btn" onclick="handleLogin()">Sign In / Register</button>
            <p id="login-error" style="color: #ff4b4b; font-size: 0.85rem; text-align: center;"></p>
        </div>
    </div>

    <!-- 2. Personal Account & DP Screen -->
    <div id="profile-screen" class="overlay-screen" style="display: none;">
        <div class="modal-box">
            <h2>👤 Personal Account</h2>
            <img id="my-dp-preview" src="https://i.imgur.com/6VBx3io.png" class="dp-preview">
            <p id="account-name-display" style="text-align: center; font-weight: bold; color: #00adb5;"></p>
            
            <label style="font-size: 0.8rem; color: #aaa;">Upload / Change Display Picture (DP):</label>
            <input type="file" id="dp-input" accept="image/*" style="color: #fff;">
            
            <button class="send-btn" onclick="saveProfileDP()">Save Profile DP</button>
            <button class="btn-small" onclick="closeProfileScreen()">Back to Chat</button>
        </div>
    </div>

    <!-- 3. Main Fixed App Interface -->
    <div class="app-container">
        <header>
            <div>
                <h1>🖤 OMBIRI</h1>
                <p id="room-subtitle" style="font-size: 0.75rem; color: #888; margin-top: 2px;">Total Chat (Team Group)</p>
            </div>
            <div class="header-actions">
                <button class="btn-small" onclick="openProfileScreen()">⚙️ Account</button>
                <button class="btn-small danger" onclick="handleLogout()">Sign Out</button>
            </div>
        </header>

        <!-- Dynamic User & Room Switcher -->
        <div class="nav-bar" id="nav-rooms">
            <button class="nav-btn active" onclick="switchChat('group', this)">💬 Group Chat</button>
        </div>

        <!-- Chat Output Container -->
        <div id="chat-messages"></div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <label class="file-label" title="Attach Image">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // YOUR EXACT FIREBASE CONFIGURATION (WITH DATABASE URL ADDED)
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.firebaseio.com/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = localStorage.getItem("ombiri_dp") || "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (pass !== "162012") {
                errorElement.innerText = "Incorrect Password!";
                return;
            }
            if (!name) {
                errorElement.innerText = "Please enter your name!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            firebase.database().ref('users/' + name).set({
                name: name,
                dp: currentDP
            });

            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openProfileScreen() {
            document.getElementById("account-name-display").innerText = "Account: " + currentUser;
            document.getElementById("my-dp-preview").src = currentDP;
            document.getElementById("profile-screen").style.display = "flex";
        }

        function closeProfileScreen() {
            document.getElementById("profile-screen").style.display = "none";
        }

        function saveProfileDP() {
            const fileInput = document.getElementById("dp-input");
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    currentDP = reader.result;
                    localStorage.setItem("ombiri_dp", currentDP);
                    document.getElementById("my-dp-preview").src = currentDP;
                    
                    firebase.database().ref('users/' + currentUser).update({ dp: currentDP });
                    alert("Profile DP Updated!");
                    closeProfileScreen();
                }
            } else {
                closeProfileScreen();
            }
        }

        function switchChat(recipient, btnElement) {
            currentRecipient = recipient;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const subtitle = recipient === 'group' ? "Total Chat (Team Group)" : `1v1 Chat with ${recipient}`;
            document.getElementById("room-subtitle").innerText = subtitle;
            loadMessages();
        }

        function initChat() {
            loadUsersAndRooms();
            loadMessages();
        }

        function loadUsersAndRooms() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const navBar = document.getElementById("nav-rooms");
                let html = `<button class="nav-btn ${currentRecipient === 'group' ? 'active' : ''}" onclick="switchChat('group', this)">💬 Group Chat</button>`;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name && user.name !== currentUser) {
                        const isActive = currentRecipient === user.name ? 'active' : '';
                        html += `<button class="nav-btn ${isActive}" onclick="switchChat('${user.name}', this)">👤 ${user.name}</button>`;
                    }
                });
                navBar.innerHTML = html;
            });
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgId = childSnapshot.key;
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        const userDp = data.dp || "https://i.imgur.com/6VBx3io.png";
                        
                        let imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                        
                        let html = `
                            <div class="${cardClass}">
                                <img src="${userDp}" class="msg-dp">
                                <div class="msg-body">
                                    <div class="message-header">
                                        <span class="sender-name">${data.sender}</span>
                                        <span class="timestamp">${data.timestamp}</span>
                                    </div>
                                    <div class="message-text">${data.message || ""}</div>
                                    ${imgTag}
                                    <button class="delete-btn" onclick="deleteMessage('${msgId}')">Delete 🗑️</button>
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessageData(text, reader.result, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushMessageData(text, null, timeStr);
            }
        }

        function pushMessageData(text, imageBase64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageBase64,
                dp: currentDP,
                timestamp: timestamp
            });
            document.getElementById("message-input").value = "";
        }

        function deleteMessage(id) {
            firebase.database().ref('messages/' + id).remove();
        }
    </script>
</body>
</html>
