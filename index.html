<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ombiri - 3D Glass Messenger</title>
    
    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        
        html, body {
            background-color: #030305;
            color: #f5f5f7;
            width: 100vw;
            height: 100dvh; /* Fixed for Mobile Viewports */
            overflow: hidden;
            position: fixed;
        }

        /* 3D Ambient Glowing Light Orbs Background */
        .ambient-bg {
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 280px; height: 280px; background: #0071e3; top: -50px; left: -40px; }
        .orb-2 { width: 320px; height: 320px; background: #af52de; bottom: -80px; right: -50px; animation-delay: -4s; }
        .orb-3 { width: 220px; height: 220px; background: #ff2d55; top: 40%; left: 30%; animation-delay: -8s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        /* Main Container with 3D Glass Shell */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 100dvh; /* Strict Mobile Height */
            margin: 0 auto;
            background: rgba(18, 18, 24, 0.55);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        
        /* 3D Glass Header */
        header {
            padding: 14px 18px;
            background: rgba(30, 30, 40, 0.45);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }
        .logo-area h1 {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
        }
        .logo-area p { font-size: 0.7rem; color: #a1a1aa; margin-top: 1px; }
        .header-actions { display: flex; gap: 8px; }
        
        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            color: #f5f5f7;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-icon:active { transform: scale(0.92); }

        /* Instagram-Style Active Status Glass Bar */
        .insta-bar {
            display: flex;
            padding: 12px 16px;
            gap: 14px;
            background: rgba(15, 15, 20, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .insta-bar::-webkit-scrollbar { display: none; }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .story-ring {
            width: 54px; height: 54px;
            border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(135deg, #0071e3, #af52de, #ff2d55);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }
        .story-ring.group-ring { background: linear-gradient(135deg, #30d158, #0071e3); }
        .story-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #101015;
        }
        .story-name { font-size: 0.7rem; color: #d1d1d6; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* Chat Scroll Feed */
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        /* 3D Glass Message Card */
        .message-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 10px 25px rgba(0, 0, 0, 0.35);
            max-width: 82%;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: slideUp 0.25s ease-out;
            transform-style: preserve-3d;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .message-card.me {
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.35), rgba(175, 82, 222, 0.35));
            border-color: rgba(255, 255, 255, 0.25);
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .msg-body { flex: 1; }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 8px;
        }
        .sender-name { font-size: 0.78rem; font-weight: 600; color: #64d2ff; }
        .message-card.me .sender-name { color: #ffd60a; }
        .timestamp { font-size: 0.65rem; color: #a1a1aa; }
        .message-text { font-size: 0.92rem; color: #ffffff; word-break: break-word; line-height: 1.4; }
        .message-image { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(255, 255, 255, 0.15); }
        
        .msg-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .like-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 8px;
            border-radius: 12px;
            color: #d1d1d6;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .like-btn.liked { background: rgba(255, 45, 85, 0.25); color: #ff2d55; border-color: rgba(255, 45, 85, 0.4); }
        .delete-btn { background: none; border: none; color: #a1a1aa; cursor: pointer; font-size: 0.72rem; }

        /* Realtime Typing Indicator Bar */
        #typing-indicator {
            padding: 4px 18px;
            font-size: 0.72rem;
            color: #64d2ff;
            font-style: italic;
            min-height: 18px;
        }

        /* Responsive 3D Glass Footer (Guaranteed Full Visibility) */
        .chat-footer {
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* iOS Safe Notch */
            background: rgba(25, 25, 32, 0.75);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .input-form { display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        
        input[type="text"], input[type="password"] {
            flex: 1;
            min-width: 0; /* Prevents button overflow */
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 12px 14px;
            outline: none;
            font-size: 0.92rem;
        }
        input[type="text"]:focus {
            border-color: #0071e3;
            box-shadow: 0 0 12px rgba(0, 113, 227, 0.4);
        }
        
        .send-btn {
            background: linear-gradient(135deg, #0071e3 0%, #30b0ff 100%);
            color: #ffffff;
            border: none;
            padding: 0 16px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            height: 44px;
            flex-shrink: 0; /* Ensures full width visibility */
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 4px 15px rgba(0, 113, 227, 0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:active { transform: scale(0.95); }

        .file-label {
            background: rgba(255, 255, 255, 0.08);
            color: #64d2ff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
            width: 44px; height: 44px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Fullscreen Glass Modals */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(25px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: rgba(30, 30, 40, 0.8);
            backdrop-filter: blur(40px);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-box h2 { color: #ffffff; text-align: center; font-size: 1.4rem; font-weight: 700; }
        .dp-preview {
            width: 80px; height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto;
            border: 2px solid #0071e3;
            box-shadow: 0 0 20px rgba(0, 113, 227, 0.4);
        }
        .btn-danger {
            background: rgba(255, 45, 85, 0.15);
            color: #ff2d55;
            border: 1px solid rgba(255, 45, 85, 0.3);
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Ambient Glow Orbs -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- 1. Login Modal -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2>Ombiri 3D</h2>
            <p style="font-size: 0.8rem; color: #a1a1aa; text-align: center;">Enter security access credentials</p>
            <input type="text" id="username-input" placeholder="Codename / Account Name">
            <input type="password" id="password-input" placeholder="Security Passcode (162012)">
            <button class="send-btn" onclick="handleLogin()" style="width: 100%; height: 46px;">Connect Node</button>
            <p id="login-error" style="color: #ff2d55; font-size: 0.82rem; text-align: center;"></p>
        </div>
    </div>

    <!-- 2. Account & Profile Modal -->
    <div id="profile-screen" class="overlay-screen" style="display: none;">
        <div class="modal-box">
            <h2>Node Settings</h2>
            <img id="my-dp-preview" src="https://i.imgur.com/6VBx3io.png" class="dp-preview">
            <p id="account-name-display" style="text-align: center; font-weight: 600; color: #64d2ff;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: #a1a1aa;">Update Profile DP:</label>
                <input type="file" id="dp-input" accept="image/*" style="color: #fff; font-size: 0.85rem;">
            </div>
            
            <button class="send-btn" onclick="saveProfileDP()" style="width: 100%; height: 44px;">Save Changes</button>
            <button class="btn-secondary" onclick="closeProfileScreen()">Back to Chat</button>
            <button class="btn-danger" onclick="deleteAccount()">Delete Account & Wipe Data</button>
        </div>
    </div>

    <!-- 3. Main Glass Application Container -->
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>Ombiri</h1>
                <p id="room-subtitle">Encrypted Group Channel</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openProfileScreen()" title="Settings">⚙️</button>
                <button class="btn-icon" onclick="handleLogout()" title="Disconnect">🚪</button>
            </div>
        </header>

        <!-- Instagram Stories & DM Bar -->
        <div class="insta-bar" id="insta-stories">
            <div class="story-item" onclick="switchChat('group', this)">
                <div class="story-ring group-ring">
                    <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                </div>
                <span class="story-name">Group Chat</span>
            </div>
        </div>

        <!-- Chat Stream -->
        <div id="chat-messages"></div>

        <!-- Live Typing Indicator -->
        <div id="typing-indicator"></div>

        <!-- Responsive Footer Input -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <label class="file-label" title="Attach Media">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Message channel..." oninput="handleTyping()">
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GOOGLE FIREBASE CONFIGURATION (ASIA REALTIME DATABASE)
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = localStorage.getItem("ombiri_dp") || "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";
        let typingTimeout = null;

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (pass !== "162012") {
                errorElement.innerText = "Invalid security passcode!";
                return;
            }
            if (!name) {
                errorElement.innerText = "Please enter a name!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            firebase.database().ref('users/' + name).set({
                name: name,
                dp: currentDP
            });

            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openProfileScreen() {
            document.getElementById("account-name-display").innerText = "User: " + currentUser;
            document.getElementById("my-dp-preview").src = currentDP;
            document.getElementById("profile-screen").style.display = "flex";
        }

        function closeProfileScreen() {
            document.getElementById("profile-screen").style.display = "none";
        }

        function saveProfileDP() {
            const fileInput = document.getElementById("dp-input");
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    currentDP = reader.result;
                    localStorage.setItem("ombiri_dp", currentDP);
                    document.getElementById("my-dp-preview").src = currentDP;
                    firebase.database().ref('users/' + currentUser).update({ dp: currentDP });
                    alert("Profile updated!");
                    closeProfileScreen();
                }
            } else {
                closeProfileScreen();
            }
        }

        function deleteAccount() {
            if (confirm("WARNING: This will permanently wipe your account and presence from the database.")) {
                firebase.database().ref('users/' + currentUser).remove().then(() => {
                    localStorage.clear();
                    location.reload();
                });
            }
        }

        function switchChat(recipient, el) {
            currentRecipient = recipient;
            document.querySelectorAll('.story-ring').forEach(r => r.style.transform = 'scale(1)');
            if(el) {
                const ring = el.querySelector('.story-ring');
                if(ring) ring.style.transform = 'scale(1.1)';
            }
            
            const subtitle = recipient === 'group' ? "Encrypted Group Channel" : `Direct Message: ${recipient}`;
            document.getElementById("room-subtitle").innerText = subtitle;
            loadMessages();
        }

        function initChat() {
            loadActiveUsersAndStories();
            loadMessages();
            listenForTyping();
        }

        function loadActiveUsersAndStories() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const bar = document.getElementById("insta-stories");
                let html = `
                    <div class="story-item" onclick="switchChat('group', this)">
                        <div class="story-ring group-ring" style="${currentRecipient === 'group' ? 'transform: scale(1.1);' : ''}">
                            <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                        </div>
                        <span class="story-name">Group Chat</span>
                    </div>
                `;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name && user.name !== currentUser) {
                        const isSelected = currentRecipient === user.name;
                        html += `
                            <div class="story-item" onclick="switchChat('${user.name}', this)">
                                <div class="story-ring" style="${isSelected ? 'transform: scale(1.1);' : ''}">
                                    <img src="${user.dp || 'https://i.imgur.com/6VBx3io.png'}" class="story-img">
                                </div>
                                <span class="story-name">${user.name}</span>
                            </div>
                        `;
                    }
                });
                bar.innerHTML = html;
            });
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgId = childSnapshot.key;
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        const userDp = data.dp || "https://i.imgur.com/6VBx3io.png";
                        const imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                        const isLiked = data.likes && data.likes[currentUser];

                        let html = `
                            <div class="${cardClass}">
                                <img src="${userDp}" class="msg-dp">
                                <div class="msg-body">
                                    <div class="message-header">
                                        <span class="sender-name">${data.sender}</span>
                                        <span class="timestamp">${data.timestamp} ✓✓</span>
                                    </div>
                                    <div class="message-text">${data.message || ""}</div>
                                    ${imgTag}
                                    <div class="msg-footer-row">
                                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${msgId}')">
                                            ${isLiked ? '❤️' : '🤍'} ${data.likeCount || 0}
                                        </button>
                                        <button class="delete-btn" onclick="deleteMessage('${msgId}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function handleTyping() {
            firebase.database().ref('typing/' + currentUser).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                firebase.database().ref('typing/' + currentUser).set(false);
            }, 1500);
        }

        function listenForTyping() {
            firebase.database().ref('typing').on('value', (snapshot) => {
                const indicator = document.getElementById("typing-indicator");
                let typingUsers = [];
                snapshot.forEach((child) => {
                    if (child.key !== currentUser && child.val() === true) {
                        typingUsers.push(child.key);
                    }
                });
                if (typingUsers.length > 0) {
                    indicator.innerText = `${typingUsers.join(", ")} is typing...`;
                } else {
                    indicator.innerText = "";
                }
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessageData(text, reader.result, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushMessageData(text, null, timeStr);
            }
            firebase.database().ref('typing/' + currentUser).set(false);
        }

        function pushMessageData(text, imageBase64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageBase64,
                dp: currentDP,
                timestamp: timestamp,
                likeCount: 0
            });
            document.getElementById("message-input").value = "";
        }

        function toggleLike(msgId) {
            const msgRef = firebase.database().ref('messages/' + msgId);
            msgRef.transaction((msg) => {
                if (msg) {
                    msg.likes = msg.likes || {};
                    msg.likeCount = msg.likeCount || 0;
                    if (msg.likes[currentUser]) {
                        msg.likes[currentUser] = null;
                        msg.likeCount -= 1;
                    } else {
                        msg.likes[currentUser] = true;
                        msg.likeCount += 1;
                    }
                }
                return msg;
            });
        }

        function deleteMessage(id) {
            firebase.database().ref('messages/' + id).remove();
        }
    </script>
</body>
</html>
