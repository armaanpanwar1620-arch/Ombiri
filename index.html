<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ombiri - Glassmorphic Messenger</title>
    
    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body {
            background-color: #000000;
            color: #f5f5f7;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        
        /* Dynamic Ambient Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: rgba(0, 113, 227, 0.15);
            top: -100px; left: -50px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: rgba(175, 82, 222, 0.12);
            bottom: -100px; right: -50px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            background: rgba(22, 22, 24, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        /* Apple-Style Glass Header */
        header {
            padding: 16px 20px;
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area h1 {
            color: #f5f5f7;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logo-area p { font-size: 0.72rem; color: #86868b; margin-top: 1px; }
        .header-actions { display: flex; gap: 10px; }
        
        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            color: #f5f5f7;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        /* Instagram-Style Stories / Active Status Glass Bar */
        .insta-bar {
            display: flex;
            padding: 14px 18px;
            gap: 16px;
            background: rgba(20, 20, 25, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .insta-bar::-webkit-scrollbar { display: none; }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .story-ring {
            width: 56px; height: 56px;
            border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(135deg, #0071e3, #af52de, #ff2d55);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .story-ring:hover { transform: scale(1.05); }
        .story-ring.group-ring {
            background: linear-gradient(135deg, #34c759, #0071e3);
        }
        .story-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #1c1c1e;
        }
        .story-name { font-size: 0.72rem; color: #aeaeb2; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* Main Glass Chat Feed */
        #chat-messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: transparent;
        }
        
        .message-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 82%;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message-card.me {
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.25), rgba(175, 82, 222, 0.25));
            border-color: rgba(0, 113, 227, 0.3);
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .msg-body { flex: 1; }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 10px;
        }
        .sender-name { font-size: 0.8rem; font-weight: 600; color: #0a84ff; }
        .message-card.me .sender-name { color: #5ac8fa; }
        .timestamp { font-size: 0.65rem; color: #86868b; }
        .message-text { font-size: 0.92rem; color: #f5f5f7; word-break: break-word; line-height: 1.45; }
        .message-image { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .msg-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .like-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 20px; color: #86868b; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s;
        }
        .like-btn.liked { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border-color: rgba(255, 59, 48, 0.3); }
        .delete-btn {
            background: none; border: none; color: #86868b; cursor: pointer; font-size: 0.75rem; transition: color 0.2s;
        }
        .delete-btn:hover { color: #ff3b30; }

        /* Apple-Style Glass Footer Input */
        .chat-footer {
            padding: 14px 18px;
            background: rgba(30, 30, 35, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .input-form { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        
        input[type="text"], input[type="password"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #0071e3;
            box-shadow: 0 0 15px rgba(0, 113, 227, 0.25);
        }
        
        .send-btn {
            background: linear-gradient(135deg, #0071e3 0%, #409cff 100%);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            height: 46px;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.3);
            transition: transform 0.2s;
        }
        .send-btn:active { transform: scale(0.96); }

        .file-label {
            background: rgba(255, 255, 255, 0.07);
            color: #5ac8fa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.15rem;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .file-label:hover { background: rgba(255, 255, 255, 0.12); }

        /* Fullscreen Glass Modals */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: rgba(30, 30, 35, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
        .modal-box h2 { color: #f5f5f7; text-align: center; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.3px; }
        .dp-preview {
            width: 84px; height: 84px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto;
            border: 2px solid rgba(0, 113, 227, 0.6);
            box-shadow: 0 0 25px rgba(0, 113, 227, 0.3);
        }
        .btn-danger {
            background: rgba(255, 59, 48, 0.12);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.25);
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger:hover { background: rgba(255, 59, 48, 0.22); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f5f5f7;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    </style>
</head>
<body>

    <!-- 1. Login / Auth Screen -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2>Ombiri</h2>
            <p style="font-size: 0.8rem; color: #86868b; text-align: center;">Authenticate node access credentials</p>
            <input type="text" id="username-input" placeholder="Codename / Account Name">
            <input type="password" id="password-input" placeholder="Security Passcode (162012)">
            <button class="send-btn" onclick="handleLogin()" style="width: 100%; height: 48px;">Connect Securely</button>
            <p id="login-error" style="color: #ff3b30; font-size: 0.82rem; text-align: center;"></p>
        </div>
    </div>

    <!-- 2. Profile & Account Settings Modal (Includes Account Deletion) -->
    <div id="profile-screen" class="overlay-screen" style="display: none;">
        <div class="modal-box">
            <h2>Node Settings</h2>
            <img id="my-dp-preview" src="https://i.imgur.com/6VBx3io.png" class="dp-preview">
            <p id="account-name-display" style="text-align: center; font-weight: 600; color: #5ac8fa;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: #86868b;">Update Display Picture:</label>
                <input type="file" id="dp-input" accept="image/*" style="color: #fff; font-size: 0.85rem;">
            </div>
            
            <button class="send-btn" onclick="saveProfileDP()" style="width: 100%; height: 46px;">Save Changes</button>
            <button class="btn-secondary" onclick="closeProfileScreen()">Return to Chat</button>
            <button class="btn-danger" onclick="deleteAccount()">Delete Account & Wipe Data</button>
        </div>
    </div>

    <!-- 3. Main Application Interface -->
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>Ombiri</h1>
                <p id="room-subtitle">Encrypted Group Channel</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openProfileScreen()" title="Settings">⚙️</button>
                <button class="btn-icon" onclick="handleLogout()" title="Disconnect">🚪</button>
            </div>
        </header>

        <!-- Instagram-Style Stories / Active Status Bar -->
        <div class="insta-bar" id="insta-stories">
            <div class="story-item" onclick="switchChat('group', this)">
                <div class="story-ring group-ring">
                    <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                </div>
                <span class="story-name">Group Chat</span>
            </div>
        </div>

        <!-- Chat Messages Feed -->
        <div id="chat-messages"></div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <label class="file-label" title="Attach Media">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Message secure channel...">
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GOOGLE FIREBASE CONFIGURATION (ASIA REALTIME DATABASE)
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = localStorage.getItem("ombiri_dp") || "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (pass !== "162012") {
                errorElement.innerText = "Invalid security passcode!";
                return;
            }
            if (!name) {
                errorElement.innerText = "Please enter a codename!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            firebase.database().ref('users/' + name).set({
                name: name,
                dp: currentDP
            });

            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openProfileScreen() {
            document.getElementById("account-name-display").innerText = "Codename: " + currentUser;
            document.getElementById("my-dp-preview").src = currentDP;
            document.getElementById("profile-screen").style.display = "flex";
        }

        function closeProfileScreen() {
            document.getElementById("profile-screen").style.display = "none";
        }

        function saveProfileDP() {
            const fileInput = document.getElementById("dp-input");
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    currentDP = reader.result;
                    localStorage.setItem("ombiri_dp", currentDP);
                    document.getElementById("my-dp-preview").src = currentDP;
                    firebase.database().ref('users/' + currentUser).update({ dp: currentDP });
                    alert("Node profile updated successfully!");
                    closeProfileScreen();
                }
            } else {
                closeProfileScreen();
            }
        }

        function deleteAccount() {
            if (confirm("WARNING: This will permanently wipe your profile and data from the database. Proceed?")) {
                firebase.database().ref('users/' + currentUser).remove().then(() => {
                    localStorage.clear();
                    location.reload();
                });
            }
        }

        function switchChat(recipient, el) {
            currentRecipient = recipient;
            document.querySelectorAll('.story-ring').forEach(r => r.style.borderColor = 'transparent');
            if(el) {
                const ring = el.querySelector('.story-ring');
                if(ring) ring.style.borderColor = '#0071e3';
            }
            
            const subtitle = recipient === 'group' ? "Encrypted Group Channel" : `Secure Direct Message: ${recipient}`;
            document.getElementById("room-subtitle").innerText = subtitle;
            loadMessages();
        }

        function initChat() {
            loadActiveUsersAndStories();
            loadMessages();
        }

        function loadActiveUsersAndStories() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const bar = document.getElementById("insta-stories");
                let html = `
                    <div class="story-item" onclick="switchChat('group', this)">
                        <div class="story-ring group-ring" style="${currentRecipient === 'group' ? 'border-color: #34c759;' : ''}">
                            <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                        </div>
                        <span class="story-name">Group Chat</span>
                    </div>
                `;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name && user.name !== currentUser) {
                        const isSelected = currentRecipient === user.name;
                        html += `
                            <div class="story-item" onclick="switchChat('${user.name}', this)">
                                <div class="story-ring" style="${isSelected ? 'border-color: #0071e3;' : ''}">
                                    <img src="${user.dp || 'https://i.imgur.com/6VBx3io.png'}" class="story-img">
                                </div>
                                <span class="story-name">${user.name}</span>
                            </div>
                        `;
                    }
                });
                bar.innerHTML = html;
            });
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgId = childSnapshot.key;
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        const userDp = data.dp || "https://i.imgur.com/6VBx3io.png";
                        const imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                        const isLiked = data.likes && data.likes[currentUser];

                        let html = `
                            <div class="${cardClass}">
                                <img src="${userDp}" class="msg-dp">
                                <div class="msg-body">
                                    <div class="message-header">
                                        <span class="sender-name">${data.sender}</span>
                                        <span class="timestamp">${data.timestamp}</span>
                                    </div>
                                    <div class="message-text">${data.message || ""}</div>
                                    ${imgTag}
                                    <div class="msg-footer-row">
                                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${msgId}')">
                                            ${isLiked ? '❤️' : '🤍'} ${data.likeCount || 0}
                                        </button>
                                        <button class="delete-btn" onclick="deleteMessage('${msgId}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessageData(text, reader.result, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushMessageData(text, null, timeStr);
            }
        }

        function pushMessageData(text, imageBase64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageBase64,
                dp: currentDP,
                timestamp: timestamp,
                likeCount: 0
            });
            document.getElementById("message-input").value = "";
        }

        function toggleLike(msgId) {
            const msgRef = firebase.database().ref('messages/' + msgId);
            msgRef.transaction((msg) => {
                if (msg) {
                    msg.likes = msg.likes || {};
                    msg.likeCount = msg.likeCount || 0;
                    if (msg.likes[currentUser]) {
                        msg.likes[currentUser] = null;
                        msg.likeCount -= 1;
                    } else {
                        msg.likes[currentUser] = true;
                        msg.likeCount += 1;
                    }
                }
                return msg;
            });
        }

        function deleteMessage(id) {
            firebase.database().ref('messages/' + id).remove();
        }
    </script>
</body>
</html>
