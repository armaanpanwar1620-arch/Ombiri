<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombiri - Secure Chat</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100%; background-color: #0b0b0b; display: flex; flex-direction: column; border: 1px solid #222; }
        
        /* Header & Sidebar */
        header { padding: 12px 15px; background-color: #121212; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #D4AF37; font-family: 'Cinzel', serif; font-size: 1.3rem; letter-spacing: 2px; }
        .profile-btn { background: none; border: 1px solid #333; color: #D4AF37; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        /* Navigation / Rooms */
        .nav-bar { display: flex; background-color: #161616; padding: 8px; gap: 8px; border-bottom: 1px solid #222; overflow-x: auto; }
        .nav-btn { background: #222; color: #ccc; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        .nav-btn.active { background: #D4AF37; color: #000; font-weight: bold; }
        
        /* Chat Messages */
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-card { background-color: #121212; padding: 10px 14px; border-radius: 12px; border: 1px solid #2a2a2a; max-width: 85%; display: flex; gap: 10px; align-items: flex-start; }
        .message-card.me { background-color: #1f1f1f; border-color: #D4AF37; align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; object-fit: cover; }
        .msg-content { flex: 1; }
        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .sender-name { font-size: 0.8rem; font-weight: bold; color: #00adb5; }
        .message-card.me .sender-name { color: #D4AF37; }
        .timestamp { font-size: 0.7rem; color: #777; }
        .message-text { font-size: 0.95px; color: #fff; word-break: break-word; }
        .message-image { max-width: 100%; border-radius: 8px; margin-top: 6px; }
        
        /* Footer Input */
        .chat-footer { padding: 12px; background-color: #121212; border-top: 1px solid #222; }
        .input-form { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; background-color: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 10px; outline: none; font-size: 0.95rem; }
        input[type="text"]:focus { border-color: #D4AF37; }
        .action-btn { background: #222; color: #D4AF37; border: 1px solid #333; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .send-btn { background-color: #D4AF37; color: #000; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; height: 40px; }
        
        /* Modals (Login & Profile) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #121212; padding: 24px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
        .modal-box h2 { color: #D4AF37; text-align: center; }
    </style>
</head>
<body>

    <!-- Login Screen Modal -->
    <div id="login-screen" class="modal">
        <div class="modal-box">
            <h2>🖤 OMBIRI</h2>
            <input type="text" id="username-input" placeholder="Enter Your Name">
            <input type="password" id="password-input" placeholder="Enter Password">
            <button class="send-btn" style="width: 100%; height: 45px;" onclick="handleLogin()">Enter App</button>
            <p id="login-error" style="color: #ff4b4b; font-size: 0.85rem; text-align: center;"></p>
        </div>
    </div>

    <!-- Profile Setup Modal -->
    <div id="profile-modal" class="modal" style="display: none;">
        <div class="modal-box">
            <h2>Edit Profile</h2>
            <p style="font-size: 0.85rem; color: #888;">Upload your Display Picture (DP):</p>
            <input type="file" id="dp-file-input" accept="image/*" style="color: #fff;">
            <button class="send-btn" style="width: 100%; height: 40px;" onclick="saveProfileDP()">Save DP</button>
            <button class="action-btn" onclick="toggleProfileModal(false)">Close</button>
        </div>
    </div>

    <!-- Main App Layout -->
    <div class="app-container">
        <header>
            <h1>🖤 OMBIRI</h1>
            <button class="profile-btn" onclick="toggleProfileModal(true)">⚙️ Profile</button>
        </header>

        <!-- Room Switcher Navigation Bar -->
        <div class="nav-bar" id="nav-rooms">
            <button class="nav-btn active" onclick="switchChat('group', this)">💬 Group Chat</button>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages"></div>

        <!-- Input Footer -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <input type="text" id="message-input" placeholder="Type a message or record voice...">
                    <label class="action-btn" title="Attach Image">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <button type="button" id="mic-btn" class="action-btn" onclick="toggleVoiceRecord()" title="Record Voice">🎤</button>
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            databaseURL: "https://YOUR-FIREBASE-APP-DEFAULT-RDB.firebaseio.com"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = localStorage.getItem("ombiri_dp") || "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";
        let mediaRecorder;
        let audioChunks = [];

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initApp();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (!pass || !name) {
                errorElement.innerText = "Please fill out all fields!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            // Register user in Firebase database registry
            firebase.database().ref('users/' + name).set({ name: name, dp: currentDP });

            document.getElementById("login-screen").style.display = "none";
            initApp();
        }

        function toggleProfileModal(show) {
            document.getElementById("profile-modal").style.display = show ? "flex" : "none";
        }

        function saveProfileDP() {
            const fileInput = document.getElementById("dp-file-input");
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    currentDP = reader.result;
                    localStorage.setItem("ombiri_dp", currentDP);
                    firebase.database().ref('users/' + currentUser).update({ dp: currentDP });
                    toggleProfileModal(false);
                    alert("DP Updated Successfully!");
                }
            }
        }

        function initApp() {
            loadUsersAndRooms();
            loadMessages();
        }

        function loadUsersAndRooms() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const navBar = document.getElementById("nav-rooms");
                navBar.innerHTML = `<button class="nav-btn ${currentRecipient === 'group' ? 'active' : ''}" onclick="switchChat('group', this)">💬 Group Chat</button>`;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user.name !== currentUser) {
                        const isActive = currentRecipient === user.name ? 'active' : '';
                        navBar.innerHTML += `<button class="nav-btn ${isActive}" onclick="switchChat('${user.name}', this)">👤 ${user.name}</button>`;
                    }
                });
            });
        }

        function switchChat(recipient, btnElement) {
            currentRecipient = recipient;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            loadMessages();
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        
                        let mediaTag = "";
                        if (data.image) mediaTag = `<img src="${data.image}" class="message-image">`;
                        if (data.audio) mediaTag = `<audio controls src="${data.audio}" style="margin-top:5px; max-width:200px;"></audio>`;
                        
                        let html = `
                            <div class="${cardClass}">
                                <img src="${data.dp || 'https://i.imgur.com/6VBx3io.png'}" class="msg-avatar">
                                <div class="msg-content">
                                    <div class="message-header">
                                        <span class="sender-name">${data.sender}</span>
                                        <span class="timestamp">${data.timestamp}</span>
                                    </div>
                                    <div class="message-text">${data.message || ""}</div>
                                    ${mediaTag}
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushData(text, reader.result, null, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushData(text, null, null, timeStr);
            }
        }

        function pushData(text, imageB64, audioB64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageB64,
                audio: audioB64,
                dp: currentDP,
                timestamp: timestamp
            });
            document.getElementById("message-input").value = "";
        }

        // Voice Recording Handlers
        let isRecording = false;
        function toggleVoiceRecord() {
            const micBtn = document.getElementById("mic-btn");
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onload = function() {
                            const now = new Date();
                            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
                            pushData("[Voice Note]", null, reader.result, timeStr);
                        }
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.style.background = "#ff4b4b";
                }).catch(err => alert("Microphone access denied!"));
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.style.background = "#222";
            }
        }
    </script>
</body>
</html>
