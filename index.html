<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ombiri - Luxury Black & Gold 3D Messenger</title>

    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        
        html, body {
            background-color: #020203;
            color: #f5f5f7;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* Ambient 3D Liquid Gold & Obsidian Glowing Background */
        .ambient-bg {
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 340px; height: 340px; background: #d4af37; top: -60px; left: -50px; }
        .orb-2 { width: 380px; height: 380px; background: #b8860b; bottom: -80px; right: -60px; animation-delay: -6s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, 35px) scale(1.12); }
        }

        /* Main Container with 3D Convex Black & Gold Glass Shell */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            margin: 0 auto;
            background: linear-gradient(145deg, rgba(14, 14, 18, 0.85), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(212, 175, 55, 0.25);
            border-right: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: inset 0 2px 4px rgba(255, 215, 0, 0.2), 0 35px 70px rgba(0, 0, 0, 0.95);
        }

        /* Luxury Black & Gold Header */
        header {
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(25, 25, 32, 0.8), rgba(10, 10, 14, 0.6));
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }
        .logo-area h1 {
            background: linear-gradient(135deg, #ffffff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.8px;
        }
        .logo-area p { font-size: 0.7rem; color: #b8860b; margin-top: 2px; font-weight: 500; }
        .header-actions { display: flex; gap: 10px; }

        /* Convex 3D Gold Action Buttons */
        .btn-convex {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.25), rgba(20, 20, 25, 0.6));
            color: #ffd700;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: inset 0 1px 2px rgba(255, 215, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-convex:active {
            transform: scale(0.92);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        /* Status & Stories Bar */
        .status-bar {
            display: flex;
            padding: 12px 16px;
            gap: 14px;
            background: rgba(10, 10, 14, 0.6);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .status-bar::-webkit-scrollbar { display: none; }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .status-ring {
            width: 56px; height: 56px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #d4af37, #ffd700, #b8860b);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.25);
        }
        .status-ring.group-ring { background: linear-gradient(135deg, #ffd700, #ff8c00); }
        .status-ring.add-status { background: rgba(255, 255, 255, 0.1); border: 2px dashed #ffd700; }
        .status-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #050508;
        }
        .status-name { font-size: 0.72rem; color: #e5e5ea; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* Mirror Search Bar */
        .search-container {
            padding: 8px 14px;
            background: rgba(10, 10, 14, 0.5);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            flex-shrink: 0;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 8px 12px;
            gap: 8px;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 0.88rem;
            color: #ffffff;
        }
        .search-box input::placeholder { color: #a1a1aa; }

        /* Main Scrollable Chat Area */
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* 3D Luxury Black & Gold Message Cards */
        .message-card {
            background: linear-gradient(145deg, rgba(25, 25, 32, 0.7), rgba(12, 12, 16, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: inset 0 1px 2px rgba(255, 215, 0, 0.15), 0 10px 25px rgba(0, 0, 0, 0.6);
            max-width: 84%;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message-card.me {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(30, 25, 10, 0.7));
            border-color: rgba(255, 215, 0, 0.5);
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 38px; height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }
        .msg-body { flex: 1; }
        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
        .sender-name { font-size: 0.8rem; font-weight: 600; color: #ffd700; }
        .message-card.me .sender-name { color: #ffdf73; }
        .timestamp { font-size: 0.65rem; color: #a1a1aa; }
        .message-text { font-size: 0.94rem; color: #ffffff; word-break: break-word; line-height: 1.4; }
        .message-image { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .message-video { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(212, 175, 55, 0.3); outline: none; }
        .voice-player { width: 100%; margin-top: 6px; border-radius: 8px; outline: none; height: 36px; filter: sepia(100%) hue-rotate(5deg) saturate(300%); }

        .msg-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .delete-btn { background: none; border: none; color: #a1a1aa; cursor: pointer; font-size: 0.72rem; }
        .delete-btn:hover { color: #ff2d55; }

        /* Realtime Typing Indicator */
        #typing-indicator {
            padding: 2px 18px;
            font-size: 0.72rem;
            color: #ffd700;
            font-style: italic;
            min-height: 18px;
        }

        /* Emoji Selection Drawer */
        #emoji-picker {
            display: none;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            padding: 10px;
            gap: 10px;
            flex-wrap: wrap;
            max-height: 120px;
            overflow-y: auto;
        }
        .emoji-item { font-size: 1.4rem; cursor: pointer; padding: 4px; transition: transform 0.1s ease; }
        .emoji-item:active { transform: scale(1.3); }

        /* Bottom Fixed Convex Input Controls */
        .chat-footer {
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(15, 15, 20, 0.85), rgba(5, 5, 8, 0.98));
            backdrop-filter: blur(35px);
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            flex-shrink: 0;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
        }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }

        input[type="text"], input[type="password"] {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
            border-radius: 18px;
            padding: 12px 14px;
            outline: none;
            font-size: 0.94rem;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .send-btn {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            color: #050508;
            border: none;
            padding: 0 16px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            height: 44px;
            flex-shrink: 0;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8), 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .danger-btn {
            background: linear-gradient(135deg, #ff2d55 0%, #ff3b30 100%);
            color: #ffffff;
            border: none;
            padding: 0 16px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            height: 44px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.4);
        }

        /* Voice Recorder Convex Button */
        .mic-btn {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.3), rgba(40, 30, 10, 0.5));
            color: #ffd700;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 44px; height: 44px;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem;
            flex-shrink: 0;
        }
        .mic-btn.recording {
            animation: pulseRecord 1s infinite alternate;
            background: #ff2d55;
            color: #fff;
            border-color: #ff2d55;
        }
        @keyframes pulseRecord { from { transform: scale(1); } to { transform: scale(1.12); } }

        /* Login, Settings & Status Overlays */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 3, 0.95);
            backdrop-filter: blur(30px);
            z-index: 300;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: linear-gradient(145deg, rgba(25, 25, 32, 0.95), rgba(10, 10, 14, 0.95));
            backdrop-filter: blur(40px);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: inset 0 1px 2px rgba(255, 215, 0, 0.3), 0 25px 60px rgba(0, 0, 0, 0.95);
            width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 16px;
        }

        #status-viewer, #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(25px);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .status-modal-content {
            background: rgba(20, 20, 26, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 24px;
            width: 100%; max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Security Passcode & Codename Screen -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2 style="text-align: center; color: #ffd700; letter-spacing: 1px;">Ombiri</h2>
            <p style="font-size: 0.8rem; color: #b8860b; text-align: center; font-weight: 500;">Secure Access Gateway</p>
            <input type="text" id="login-name-input" placeholder="Enter Agent Codename">
            <input type="password" id="login-pass-input" placeholder="Passcode (162012)">
            <button class="send-btn" onclick="verifyLogin()" style="width: 100%; height: 46px;">Authorize Node</button>
            <p id="login-error" style="color: #ff2d55; font-size: 0.82rem; text-align: center;"></p>
        </div>
    </div>

    <!-- Settings & Personal ID Management Modal -->
    <div id="settings-modal" onclick="closeSettingsModal()">
        <div class="status-modal-content" onclick="event.stopPropagation()">
            <h3 style="color: #ffd700;">Agent Settings</h3>
            <p style="font-size: 0.85rem; color: #a1a1aa;">Active Codename: <span id="settings-username" style="color:#fff; font-weight:700;"></span></p>
            <hr style="border: 0; border-top: 1px solid rgba(212,175,55,0.2);">
            <button class="danger-btn" onclick="deletePersonalAccount()">Delete Personal ID & Account</button>
            <button class="send-btn" onclick="closeSettingsModal()" style="width: 100%;">Close Settings</button>
        </div>
    </div>

    <!-- Status Viewer Modal (Photo/Video Stories Only) -->
    <div id="status-viewer" onclick="closeStatusViewer()">
        <div class="status-modal-content" onclick="event.stopPropagation()">
            <h3 id="view-status-user" style="color: #ffd700;">Story</h3>
            <div id="status-media-container"></div>
            <button class="send-btn" onclick="closeStatusViewer()" style="width: 100%;">Close Story</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>Ombiri</h1>
                <p id="room-subtitle">Encrypted Group Channel</p>
            </div>
            <div class="header-actions">
                <button class="btn-convex" onclick="openSettingsModal()" title="Settings & ID Management">⚙️</button>
                <button class="btn-convex" onclick="handleLogout()" title="Disconnect Gateway">🚪</button>
            </div>
        </header>

        <!-- Status & Stories Bar -->
        <div class="status-bar" id="status-stories">
            <div class="status-item" onclick="switchChat('group', this)">
                <div class="status-ring group-ring">
                    <img src="https://i.imgur.com/6VBx3io.png" class="status-img">
                </div>
                <span class="status-name">Group</span>
            </div>
            <div class="status-item" onclick="postImageVideoStatus()">
                <div class="status-ring add-status">
                    <span style="font-size: 1.4rem; color: #ffd700;">+</span>
                </div>
                <span class="status-name">Add Story</span>
            </div>
        </div>

        <!-- Mirror Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search-input" placeholder="Search messages..." oninput="filterMessages()">
            </div>
        </div>

        <!-- Chat Stream -->
        <div id="chat-messages"></div>

        <!-- Live Typing Indicator -->
        <div id="typing-indicator"></div>

        <!-- Emoji Quick Drawer -->
        <div id="emoji-picker">
            <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
            <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
            <span class="emoji-item" onclick="addEmoji('👑')">👑</span>
            <span class="emoji-item" onclick="addEmoji('🚀')">🚀</span>
            <span class="emoji-item" onclick="addEmoji('⚠️')">⚠️</span>
            <span class="emoji-item" onclick="addEmoji('💯')">💯</span>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
            <form onsubmit="sendMessage(event)">
                <div class="input-row">
                    <button type="button" class="btn-convex" onclick="toggleEmojiPicker()">😊</button>
                    <label class="btn-convex" title="Attach Image">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Message channel..." oninput="handleTyping()" onfocus="scrollToBottom()">
                    <button type="button" id="mic-btn" class="mic-btn" onclick="toggleVoiceRecord()">🎙️</button>
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GOOGLE FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let allMessages = [];

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function verifyLogin() {
            const nameInput = document.getElementById("login-name-input").value.trim();
            const passInput = document.getElementById("login-pass-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (passInput !== "162012") {
                errorElement.innerText = "Access Denied: Invalid Passcode (162012)";
                return;
            }
            if (!nameInput) {
                errorElement.innerText = "Please enter your agent codename!";
                return;
            }

            currentUser = nameInput;
            localStorage.setItem("ombiri_user", currentUser);
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openSettingsModal() {
            document.getElementById("settings-username").innerText = currentUser;
            document.getElementById("settings-modal").style.display = "flex";
        }

        function closeSettingsModal() {
            document.getElementById("settings-modal").style.display = "none";
        }

        function deletePersonalAccount() {
            if (confirm("Are you sure you want to permanently delete your Personal ID and Account data? This action cannot be undone.")) {
                firebase.database().ref('users_ombiri/' + currentUser).remove();
                firebase.database().ref('status_ombiri/' + currentUser).remove();
                localStorage.removeItem("ombiri_user");
                alert("Account and Personal ID deleted successfully.");
                location.reload();
            }
        }

        function switchChat(recipient, el) {
            currentRecipient = recipient;
            document.getElementById("room-subtitle").innerText = recipient === 'group' ? "Encrypted Group Channel" : `Direct Message: ${recipient}`;
            loadMessages();
        }

        function initChat() {
            firebase.database().ref('users_ombiri/' + currentUser).set({ name: currentUser, dp: currentDP });
            loadUsers();
            loadMessages();
            listenForTyping();
        }

        function loadUsers() {
            firebase.database().ref('users_ombiri').on('value', (snapshot) => {
                const bar = document.getElementById("status-stories");
                let html = `
                    <div class="status-item" onclick="switchChat('group', this)">
                        <div class="status-ring group-ring">
                            <img src="https://i.imgur.com/6VBx3io.png" class="status-img">
                        </div>
                        <span class="status-name">Group</span>
                    </div>
                    <div class="status-item" onclick="postImageVideoStatus()">
                        <div class="status-ring add-status">
                            <span style="font-size: 1.4rem; color: #ffd700;">+</span>
                        </div>
                        <span class="status-name">Add Story</span>
                    </div>
                `;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name) {
                        firebase.database().ref('status_ombiri/' + user.name).once('value', (sSnap) => {
                            const statusData = sSnap.val();
                            if (statusData && statusData.media) {
                                html += `
                                    <div class="status-item" onclick='viewStatus(${JSON.stringify(user.name)}, ${JSON.stringify(statusData.media)}, ${JSON.stringify(statusData.mediaType)})'>
                                        <div class="status-ring">
                                            <img src="${user.dp || 'https://i.imgur.com/6VBx3io.png'}" class="status-img">
                                        </div>
                                        <span class="status-name">${user.name}</span>
                                    </div>
                                `;
                                bar.innerHTML = html;
                            }
                        });
                    }
                });
            });
        }

        // Strict Image/Video Story Only (No Text)
        function postImageVideoStatus() {
            const mediaInput = document.createElement('input');
            mediaInput.type = 'file';
            mediaInput.accept = 'image/*,video/*';
            mediaInput.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    const isVideo = file.type.startsWith('video');
                    reader.readAsDataURL(file);
                    reader.onload = function() {
                        firebase.database().ref('status_ombiri/' + currentUser).set({
                            media: reader.result,
                            mediaType: isVideo ? 'video' : 'image',
                            timestamp: Date.now()
                        });
                        alert("Story uploaded successfully!");
                    };
                }
            };
            mediaInput.click();
        }

        function viewStatus(username, media, mediaType) {
            document.getElementById("view-status-user").innerText = username + "'s Story";
            const mediaContainer = document.getElementById("status-media-container");
            mediaContainer.innerHTML = mediaType === 'video' 
                ? `<video src="${media}" controls autoplay class="message-video" style="max-height:280px; width:100%;"></video>`
                : `<img src="${media}" style="max-height:280px; width:100%; object-fit:contain; border-radius:12px;">`;
            document.getElementById("status-viewer").style.display = "flex";
        }

        function closeStatusViewer() {
            document.getElementById("status-viewer").style.display = "none";
        }

        function loadMessages() {
            firebase.database().ref('messages_ombiri').on('value', (snapshot) => {
                allMessages = [];
                snapshot.forEach((child) => {
                    allMessages.push({ id: child.key, ...child.val() });
                });
                renderMessages(allMessages);
            });
        }

        function renderMessages(msgs) {
            const container = document.getElementById("chat-messages");
            container.innerHTML = "";
            msgs.forEach((data) => {
                let match = false;
                if (currentRecipient === 'group' && data.recipient === 'group') match = true;
                else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                         (data.sender === currentRecipient && data.recipient === currentUser)) match = true;

                if (match) {
                    const isMe = data.sender === currentUser;
                    const cardClass = isMe ? "message-card me" : "message-card";
                    const imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                    const audioTag = data.audio ? `<audio src="${data.audio}" controls class="voice-player"></audio>` : "";

                    container.innerHTML += `
                        <div class="${cardClass}">
                            <img src="${data.dp || 'https://i.imgur.com/6VBx3io.png'}" class="msg-dp">
                            <div class="msg-body">
                                <div class="message-header">
                                    <span class="sender-name">${data.sender}</span>
                                    <span class="timestamp">${data.timestamp}</span>
                                </div>
                                <div class="message-text">${data.message || ""}</div>
                                ${imgTag}
                                ${audioTag}
                                <div class="msg-footer-row">
                                    <button class="delete-btn" onclick="deleteMessage('${data.id}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            scrollToBottom();
        }

        function filterMessages() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = allMessages.filter(m => (m.message && m.message.toLowerCase().includes(query)));
            renderMessages(filtered);
        }

        function scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById("chat-messages");
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById("emoji-picker");
            picker.style.display = picker.style.display === "flex" ? "none" : "flex";
        }

        function addEmoji(emoji) {
            const input = document.getElementById("message-input");
            input.value += emoji;
            toggleEmojiPicker();
        }

        function handleTyping() {
            firebase.database().ref('typing_ombiri/' + currentUser).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                firebase.database().ref('typing_ombiri/' + currentUser).set(false);
            }, 1500);
        }

        function listenForTyping() {
            firebase.database().ref('typing_ombiri').on('value', (snapshot) => {
                const indicator = document.getElementById("typing-indicator");
                let users = [];
                snapshot.forEach((c) => {
                    if (c.key !== currentUser && c.val() === true) users.push(c.key);
                });
                indicator.innerText = users.length ? `${users.join(", ")} is typing...` : "";
            });
        }

        async function toggleVoiceRecord() {
            const micBtn = document.getElementById("mic-btn");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            pushMessage("", null, reader.result);
                        };
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add("recording");
                } catch (err) {
                    alert("Microphone access is required to record voice notes.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove("recording");
            }
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            const text = textInput.value.trim();

            if (!text && fileInput.files.length === 0) return;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessage(text, reader.result, null);
                    fileInput.value = "";
                };
            } else {
                pushMessage(text, null, null);
            }
        }

        function pushMessage(text, image, audio) {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            firebase.database().ref('messages_ombiri').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: image,
                audio: audio,
                dp: currentDP,
                timestamp: timeStr
            });

            document.getElementById("message-input").value = "";
            firebase.database().ref('typing_ombiri/' + currentUser).set(false);
        }

        function deleteMessage(id) {
            firebase.database().ref('messages_ombiri/' + id).remove();
        }
    </script>
</body>
</html>
