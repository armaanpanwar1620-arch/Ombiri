
     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ombiri - Cybernetic Messenger</title>
    
    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body {
            background-color: #050505;
            color: #f3f4f6;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            background-color: #0a0a0c;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1a1a1e;
            border-right: 1px solid #1a1a1e;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.05);
        }
        
        /* Futuristic Header */
        header {
            padding: 14px 18px;
            background-color: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f1f26;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-area h1 {
            color: #D4AF37;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .logo-area p { font-size: 0.7rem; color: #71717a; letter-spacing: 0.5px; }
        .header-actions { display: flex; gap: 8px; }
        
        .btn-icon {
            background: #16161c;
            color: #a1a1aa;
            border: 1px solid #272730;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover { border-color: #D4AF37; color: #D4AF37; }

        /* Instagram-Style Stories / Active Status Bar */
        .insta-bar {
            display: flex;
            padding: 12px 15px;
            gap: 14px;
            background: #0d0d10;
            border-bottom: 1px solid #1a1a1e;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .insta-bar::-webkit-scrollbar { display: none; }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .story-ring {
            width: 54px; height: 54px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex; align-items: center; justify-content: center;
        }
        .story-ring.group-ring {
            background: linear-gradient(45deg, #D4AF37, #aa771c);
        }
        .story-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0a0a0c;
        }
        .story-name { font-size: 0.7rem; color: #a1a1aa; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Main Chat Area */
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at center, #0f0f14 0%, #050505 100%);
        }
        
        .message-card {
            background: #131318;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #202028;
            max-width: 82%;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .message-card.me {
            background: linear-gradient(135deg, #181822 0%, #1e1b10 100%);
            border-color: rgba(212, 175, 55, 0.3);
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #3f3f46;
            flex-shrink: 0;
        }
        .msg-body { flex: 1; }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 8px;
        }
        .sender-name { font-size: 0.78rem; font-weight: 600; color: #38bdf8; }
        .message-card.me .sender-name { color: #D4AF37; }
        .timestamp { font-size: 0.65rem; color: #71717a; }
        .message-text { font-size: 0.9rem; color: #e4e4e7; word-break: break-word; line-height: 1.4; }
        .message-image { max-width: 100%; border-radius: 10px; margin-top: 8px; border: 1px solid #272730; }
        
        .msg-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
        .like-btn {
            background: none; border: none; color: #71717a; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 3px;
        }
        .like-btn.liked { color: #f43f5e; }
        .delete-btn {
            background: none; border: none; color: #71717a; cursor: pointer; font-size: 0.75rem;
        }
        .delete-btn:hover { color: #f43f5e; }

        /* Futuristic Footer Controls */
        .chat-footer {
            padding: 12px 16px;
            background-color: rgba(12, 12, 15, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #1f1f26;
            flex-shrink: 0;
        }
        .input-form { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        
        input[type="text"], input[type="password"] {
            flex: 1;
            background-color: #16161c;
            color: #fff;
            border: 1px solid #272730;
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            font-size: 0.92rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #D4AF37; }
        
        .send-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #aa771c 100%);
            color: #000;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            height: 46px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .file-label {
            background: #16161c;
            color: #D4AF37;
            border: 1px solid #272730;
            width: 46px; height: 46px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Fullscreen Modals */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #111115;
            padding: 28px;
            border-radius: 20px;
            border: 1px solid #22222b;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .modal-box h2 { color: #D4AF37; text-align: center; font-size: 1.4rem; letter-spacing: 1px; }
        .dp-preview {
            width: 80px; height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto;
            border: 2px solid #D4AF37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #f43f5e;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
        .btn-secondary {
            background: #1c1c24;
            color: #a1a1aa;
            border: 1px solid #2e2e38;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. Login / Auth Screen -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2>🖤 OMBIRI</h2>
            <p style="font-size: 0.8rem; color: #a1a1aa; text-align: center;">Enter security credentials to access secure node</p>
            <input type="text" id="username-input" placeholder="Codename / Account Name">
            <input type="password" id="password-input" placeholder="Security Passcode (162012)">
            <button class="send-btn" onclick="handleLogin()" style="width: 100%;">Initialize Connection</button>
            <p id="login-error" style="color: #f43f5e; font-size: 0.82rem; text-align: center;"></p>
        </div>
    </div>

    <!-- 2. Profile & Account Settings Modal (Includes Account Deletion) -->
    <div id="profile-screen" class="overlay-screen" style="display: none;">
        <div class="modal-box">
            <h2>⚙️ Node Settings</h2>
            <img id="my-dp-preview" src="https://i.imgur.com/6VBx3io.png" class="dp-preview">
            <p id="account-name-display" style="text-align: center; font-weight: 600; color: #38bdf8;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: #a1a1aa;">Update Profile Display Picture:</label>
                <input type="file" id="dp-input" accept="image/*" style="color: #fff; font-size: 0.85rem;">
            </div>
            
            <button class="send-btn" onclick="saveProfileDP()" style="width: 100%;">Save Changes</button>
            <button class="btn-secondary" onclick="closeProfileScreen()">Return to Chat</button>
            <button class="btn-danger" onclick="deleteAccount()">🗑️ Delete Account & Wipe Data</button>
        </div>
    </div>

    <!-- 3. Main Application Interface -->
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>OMBIRI</h1>
                <p id="room-subtitle">Encrypted Group Channel</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openProfileScreen()" title="Settings">⚙️</button>
                <button class="btn-icon" onclick="handleLogout()" title="Disconnect">🚪</button>
            </div>
        </header>

        <!-- Instagram-Style Direct Message & Stories Status Bar -->
        <div class="insta-bar" id="insta-stories">
            <div class="story-item" onclick="switchChat('group', this)">
                <div class="story-ring group-ring">
                    <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                </div>
                <span class="story-name">Group Chat</span>
            </div>
        </div>

        <!-- Chat Messages Feed -->
        <div id="chat-messages"></div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <label class="file-label" title="Attach Media">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Message secure channel...">
                    <button type="submit" class="send-btn">Transmit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GOOGLE FIREBASE CONFIGURATION (ASIA REALTIME DATABASE)
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = localStorage.getItem("ombiri_dp") || "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (pass !== "162012") {
                errorElement.innerText = "Invalid security passcode!";
                return;
            }
            if (!name) {
                errorElement.innerText = "Please enter a codename!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            firebase.database().ref('users/' + name).set({
                name: name,
                dp: currentDP
            });

            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openProfileScreen() {
            document.getElementById("account-name-display").innerText = "Codename: " + currentUser;
            document.getElementById("my-dp-preview").src = currentDP;
            document.getElementById("profile-screen").style.display = "flex";
        }

        function closeProfileScreen() {
            document.getElementById("profile-screen").style.display = "none";
        }

        function saveProfileDP() {
            const fileInput = document.getElementById("dp-input");
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    currentDP = reader.result;
                    localStorage.setItem("ombiri_dp", currentDP);
                    document.getElementById("my-dp-preview").src = currentDP;
                    firebase.database().ref('users/' + currentUser).update({ dp: currentDP });
                    alert("Node profile updated successfully!");
                    closeProfileScreen();
                }
            } else {
                closeProfileScreen();
            }
        }

        function deleteAccount() {
            if (confirm("WARNING: This will permanently wipe your profile and presence from the database. Proceed?")) {
                firebase.database().ref('users/' + currentUser).remove().then(() => {
                    localStorage.clear();
                    location.reload();
                });
            }
        }

        function switchChat(recipient, el) {
            currentRecipient = recipient;
            document.querySelectorAll('.story-ring').forEach(r => r.style.borderColor = 'transparent');
            if(el) {
                const ring = el.querySelector('.story-ring');
                if(ring) ring.style.borderColor = '#D4AF37';
            }
            
            const subtitle = recipient === 'group' ? "Encrypted Group Channel" : `Secure Direct Message: ${recipient}`;
            document.getElementById("room-subtitle").innerText = subtitle;
            loadMessages();
        }

        function initChat() {
            loadActiveUsersAndStories();
            loadMessages();
        }

        function loadActiveUsersAndStories() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const bar = document.getElementById("insta-stories");
                let html = `
                    <div class="story-item" onclick="switchChat('group', this)">
                        <div class="story-ring group-ring" style="${currentRecipient === 'group' ? 'border-color: #D4AF37;' : ''}">
                            <img src="https://i.imgur.com/6VBx3io.png" class="story-img">
                        </div>
                        <span class="story-name">Group Chat</span>
                    </div>
                `;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name && user.name !== currentUser) {
                        const isSelected = currentRecipient === user.name;
                        html += `
                            <div class="story-item" onclick="switchChat('${user.name}', this)">
                                <div class="story-ring" style="${isSelected ? 'border-color: #D4AF37;' : ''}">
                                    <img src="${user.dp || 'https://i.imgur.com/6VBx3io.png'}" class="story-img">
                                </div>
                                <span class="story-name">${user.name}</span>
                            </div>
                        `;
                    }
                });
                bar.innerHTML = html;
            });
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgId = childSnapshot.key;
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        const userDp = data.dp || "https://i.imgur.com/6VBx3io.png";
                        const imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                        const isLiked = data.likes && data.likes[currentUser];

                        let html = `
                            <div class="${cardClass}">
                                <img src="${userDp}" class="msg-dp">
                                <div class="msg-body">
                                    <div class="message-header">
                                        <span class="sender-name">${data.sender}</span>
                                        <span class="timestamp">${data.timestamp}</span>
                                    </div>
                                    <div class="message-text">${data.message || ""}</div>
                                    ${imgTag}
                                    <div class="msg-footer-row">
                                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${msgId}')">
                                            ${isLiked ? '❤️' : '🤍'} ${data.likeCount || 0}
                                        </button>
                                        <button class="delete-btn" onclick="deleteMessage('${msgId}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessageData(text, reader.result, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushMessageData(text, null, timeStr);
            }
        }

        function pushMessageData(text, imageBase64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageBase64,
                dp: currentDP,
                timestamp: timestamp,
                likeCount: 0
            });
            document.getElementById("message-input").value = "";
        }

        function toggleLike(msgId) {
            const msgRef = firebase.database().ref('messages/' + msgId);
            msgRef.transaction((msg) => {
                if (msg) {
                    msg.likes = msg.likes || {};
                    msg.likeCount = msg.likeCount || 0;
                    if (msg.likes[currentUser]) {
                        msg.likes[currentUser] = null;
                        msg.likeCount -= 1;
                    } else {
                        msg.likes[currentUser] = true;
                        msg.likeCount += 1;
                    }
                }
                return msg;
            });
        }

        function deleteMessage(id) {
            firebase.database().ref('messages/' + id).remove();
        }
    </script>
</body>
</html>
