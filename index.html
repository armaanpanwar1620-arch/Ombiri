<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ombiri - iOS Instagram Edition</title>

    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif; }
        
        html, body {
            background-color: #f2f2f7;
            color: #1c1c1e;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* App Main Shell - iOS Clean Style */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e5e5ea;
            border-right: 1px solid #e5e5ea;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* Header - Instagram / iOS Minimalist Header */
        header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(60, 60, 67, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #000000;
        }
        .logo-area p { font-size: 0.7rem; color: #8e8e93; font-weight: 500; }
        .header-actions { display: flex; gap: 8px; }

        /* iOS Round Action Buttons */
        .btn-ios {
            background: #f2f2f7;
            color: #007aff;
            border: none;
            border-radius: 50%;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s ease;
        }
        .btn-ios:active { transform: scale(0.92); background: #e5e5ea; }

        /* Instagram Stories / Status Bar */
        .status-bar {
            display: flex;
            padding: 12px 14px;
            gap: 14px;
            background: #ffffff;
            border-bottom: 1px solid #f2f2f7;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .status-bar::-webkit-scrollbar { display: none; }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .status-ring {
            width: 62px; height: 62px;
            border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex; align-items: center; justify-content: center;
        }
        .status-ring.group-ring { background: linear-gradient(135deg, #34c759, #007aff); }
        .status-ring.add-status { background: #f2f2f7; border: 2px dashed #007aff; }
        .status-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }
        .status-name { font-size: 0.7rem; color: #3a3a3c; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* Mirror Search Bar */
        .search-container {
            padding: 8px 14px;
            background: #ffffff;
            border-bottom: 1px solid #f2f2f7;
            flex-shrink: 0;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #eef0f3;
            border-radius: 10px;
            padding: 6px 12px;
            gap: 8px;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 0.88rem;
            color: #1c1c1e;
        }

        /* Main Messages Container */
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        /* iOS Chat Bubble Style */
        .message-card {
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            max-width: 82%;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-card.me {
            background: #007aff;
            color: #ffffff;
            border-color: #007aff;
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-dp {
            width: 34px; height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .msg-body { flex: 1; }
        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; gap: 8px; }
        .sender-name { font-size: 0.78rem; font-weight: 600; color: #007aff; }
        .message-card.me .sender-name { color: #ffffff; }
        .timestamp { font-size: 0.62rem; color: #8e8e93; }
        .message-card.me .timestamp { color: rgba(255, 255, 255, 0.8); }
        .message-text { font-size: 0.92rem; word-break: break-word; line-height: 1.35; }
        .message-card.me .message-text { color: #ffffff; }
        .message-image { max-width: 100%; border-radius: 12px; margin-top: 6px; }
        .voice-player { width: 100%; margin-top: 6px; height: 36px; }

        .msg-footer-row { display: flex; justify-content: flex-end; margin-top: 4px; }
        .delete-btn { background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 0.7rem; font-weight: 500; }

        /* Typing Indicator */
        #typing-indicator {
            padding: 2px 18px;
            font-size: 0.72rem;
            color: #007aff;
            font-style: italic;
            min-height: 18px;
            background: #fafafa;
        }

        /* Emoji Drawer */
        #emoji-picker {
            display: none;
            background: #ffffff;
            border-top: 1px solid #e5e5ea;
            padding: 10px;
            gap: 10px;
            flex-wrap: wrap;
            max-height: 120px;
            overflow-y: auto;
        }
        .emoji-item { font-size: 1.4rem; cursor: pointer; padding: 4px; }

        /* iOS Input Footer */
        .chat-footer {
            padding: 10px 14px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(60, 60, 67, 0.12);
            flex-shrink: 0;
        }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }

        input[type="text"], input[type="password"] {
            flex: 1;
            min-width: 0;
            background: #eef0f3;
            color: #1c1c1e;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 10px 14px;
            outline: none;
            font-size: 0.92rem;
        }
        input[type="text"]:focus { border-color: #007aff; background: #ffffff; }

        .send-btn {
            background: #007aff;
            color: #ffffff;
            border: none;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            height: 40px;
            flex-shrink: 0;
        }

        .mic-btn {
            background: #f2f2f7;
            color: #007aff;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem;
            flex-shrink: 0;
        }
        .mic-btn.recording { background: #ff3b30; color: #ffffff; animation: pulseRecord 1s infinite alternate; }
        @keyframes pulseRecord { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Modals & Overlays */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            z-index: 300;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 340px;
            display: flex; flex-direction: column; gap: 14px;
        }

        #todo-modal, #settings-modal, #status-viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f2f2f7; }
    </style>
</head>
<body>

    <!-- Security Login Screen -->
    <div id="login-screen" class="overlay-screen">
        <div class="modal-box">
            <h2 style="text-align: center; color: #007aff;">Ombiri</h2>
            <p style="font-size: 0.8rem; color: #8e8e93; text-align: center;">Enter Codename & Security Passcode</p>
            <input type="text" id="login-name-input" placeholder="Codename">
            <input type="password" id="login-pass-input" placeholder="Passcode (162012)">
            <button class="send-btn" onclick="verifyLogin()" style="width: 100%; height: 44px;">Enter App</button>
            <p id="login-error" style="color: #ff3b30; font-size: 0.82rem; text-align: center;"></p>
        </div>
    </div>

    <!-- To-Do Feature Modal -->
    <div id="todo-modal" onclick="closeTodoModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="color: #1c1c1e; text-align: center;">Tactical Tasks / To-Do</h3>
            <div id="todo-list" style="max-height: 200px; overflow-y: auto;"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="new-todo-input" placeholder="New task...">
                <button class="send-btn" onclick="addTodoTask()">Add</button>
            </div>
            <button class="send-btn" onclick="closeTodoModal()" style="background: #e5e5ea; color: #000;">Close</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" onclick="closeSettingsModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 style="color: #1c1c1e; text-align: center;">Settings</h3>
            <p style="font-size: 0.85rem; color: #8e8e93; text-align: center;">Active User: <span id="settings-username" style="color:#007aff; font-weight:700;"></span></p>
            <button onclick="deletePersonalAccount()" style="background:#ff3b30; color:#fff; border:none; padding:12px; border-radius:14px; font-weight:600; cursor:pointer;">Delete Personal Account</button>
            <button class="send-btn" onclick="closeSettingsModal()" style="background: #e5e5ea; color: #000;">Close</button>
        </div>
    </div>

    <!-- Status Viewer Modal -->
    <div id="status-viewer" onclick="closeStatusViewer()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 id="view-status-user" style="color: #007aff; text-align: center;">Status</h3>
            <div id="status-media-container" style="text-align: center;"></div>
            <button class="send-btn" onclick="closeStatusViewer()" style="width: 100%;">Close Story</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>Ombiri</h1>
                <p id="room-subtitle">Encrypted Group Channel</p>
            </div>
            <div class="header-actions">
                <button class="btn-ios" onclick="openTodoModal()" title="To-Do List">✅</button>
                <button class="btn-ios" onclick="openSettingsModal()" title="Settings">⚙️</button>
                <button class="btn-ios" onclick="handleLogout()" title="Logout">🚪</button>
            </div>
        </header>

        <!-- Instagram Stories Bar -->
        <div class="status-bar" id="status-stories">
            <div class="status-item" onclick="switchChat('group', this)">
                <div class="status-ring group-ring">
                    <img src="https://i.imgur.com/6VBx3io.png" class="status-img">
                </div>
                <span class="status-name">Group</span>
            </div>
            <div class="status-item" onclick="postImageVideoStatus()">
                <div class="status-ring add-status">
                    <span style="font-size: 1.4rem; color: #007aff;">+</span>
                </div>
                <span class="status-name">Add Story</span>
            </div>
        </div>

        <!-- Mirror Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search-input" placeholder="Search messages..." oninput="filterMessages()">
            </div>
        </div>

        <!-- Chat Stream -->
        <div id="chat-messages"></div>

        <!-- Live Typing Indicator -->
        <div id="typing-indicator"></div>

        <!-- Emoji Quick Drawer -->
        <div id="emoji-picker">
            <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
            <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
            <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
            <span class="emoji-item" onclick="addEmoji('🫡')">🫡</span>
            <span class="emoji-item" onclick="addEmoji('🚀')">🚀</span>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
            <form onsubmit="sendMessage(event)">
                <div class="input-row">
                    <button type="button" class="btn-ios" onclick="toggleEmojiPicker()">😊</button>
                    <label class="btn-ios" title="Attach Image">📷<input type="file" id="image-input" accept="image/*" style="display:none;"></label>
                    <input type="text" id="message-input" placeholder="Message..." oninput="handleTyping()" onfocus="scrollToBottom()">
                    <button type="button" id="mic-btn" class="mic-btn" onclick="toggleVoiceRecord()">🎙️</button>
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAgHkq2jIi82FSN5Lsz...",
            authDomain: "ombiri.firebaseapp.com",
            databaseURL: "https://ombiri-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ombiri",
            storageBucket: "ombiri.appspot.com",
            messagingSenderId: "877048914733",
            appId: "1:877048914733:web:3173...",
            measurementId: "G-ZBPXPJ8SLD"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentDP = "https://i.imgur.com/6VBx3io.png";
        let currentRecipient = "group";
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let allMessages = [];

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function verifyLogin() {
            const nameInput = document.getElementById("login-name-input").value.trim();
            const passInput = document.getElementById("login-pass-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (passInput !== "162012") {
                errorElement.innerText = "Invalid Passcode (162012)";
                return;
            }
            if (!nameInput) {
                errorElement.innerText = "Enter codename!";
                return;
            }

            currentUser = nameInput;
            localStorage.setItem("ombiri_user", currentUser);
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogout() {
            localStorage.removeItem("ombiri_user");
            location.reload();
        }

        function openSettingsModal() {
            document.getElementById("settings-username").innerText = currentUser;
            document.getElementById("settings-modal").style.display = "flex";
        }

        function closeSettingsModal() {
            document.getElementById("settings-modal").style.display = "none";
        }

        function deletePersonalAccount() {
            if (confirm("Permanently delete your account data?")) {
                firebase.database().ref('users_ombiri/' + currentUser).remove();
                firebase.database().ref('status_ombiri/' + currentUser).remove();
                localStorage.removeItem("ombiri_user");
                location.reload();
            }
        }

        function openTodoModal() {
            document.getElementById("todo-modal").style.display = "flex";
            loadTodos();
        }

        function closeTodoModal() {
            document.getElementById("todo-modal").style.display = "none";
        }

        function loadTodos() {
            firebase.database().ref('todos_ombiri/' + currentUser).on('value', snapshot => {
                const container = document.getElementById("todo-list");
                container.innerHTML = "";
                snapshot.forEach(child => {
                    const todo = child.val();
                    container.innerHTML += `
                        <div class="todo-item">
                            <span>${todo.text}</span>
                            <button onclick="deleteTodo('${child.key}')" style="border:none; background:none; color:#ff3b30; cursor:pointer;">✕</button>
                        </div>
                    `;
                });
            });
        }

        function addTodoTask() {
            const input = document.getElementById("new-todo-input");
            if (input.value.trim()) {
                firebase.database().ref('todos_ombiri/' + currentUser).push({ text: input.value.trim() });
                input.value = "";
            }
        }

        function deleteTodo(key) {
            firebase.database().ref('todos_ombiri/' + currentUser + '/' + key).remove();
        }

        function switchChat(recipient, el) {
            currentRecipient = recipient;
            document.getElementById("room-subtitle").innerText = recipient === 'group' ? "Encrypted Group Channel" : `Direct Message: ${recipient}`;
            loadMessages();
        }

        function initChat() {
            firebase.database().ref('users_ombiri/' + currentUser).set({ name: currentUser, dp: currentDP });
            loadUsers();
            loadMessages();
            listenForTyping();
        }

        function loadUsers() {
            firebase.database().ref('users_ombiri').on('value', (snapshot) => {
                const bar = document.getElementById("status-stories");
                let html = `
                    <div class="status-item" onclick="switchChat('group', this)">
                        <div class="status-ring group-ring">
                            <img src="https://i.imgur.com/6VBx3io.png" class="status-img">
                        </div>
                        <span class="status-name">Group</span>
                    </div>
                    <div class="status-item" onclick="postImageVideoStatus()">
                        <div class="status-ring add-status">
                            <span style="font-size: 1.4rem; color: #007aff;">+</span>
                        </div>
                        <span class="status-name">Add Story</span>
                    </div>
                `;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user && user.name) {
                        firebase.database().ref('status_ombiri/' + user.name).once('value', (sSnap) => {
                            const statusData = sSnap.val();
                            if (statusData && statusData.media) {
                                html += `
                                    <div class="status-item" onclick='viewStatus(${JSON.stringify(user.name)}, ${JSON.stringify(statusData.media)}, ${JSON.stringify(statusData.mediaType)})'>
                                        <div class="status-ring">
                                            <img src="${user.dp || 'https://i.imgur.com/6VBx3io.png'}" class="status-img">
                                        </div>
                                        <span class="status-name">${user.name}</span>
                                    </div>
                                `;
                                bar.innerHTML = html;
                            }
                        });
                    }
                });
            });
        }

        // Strict Photo & Video Story Only
        function postImageVideoStatus() {
            const mediaInput = document.createElement('input');
            mediaInput.type = 'file';
            mediaInput.accept = 'image/*,video/*';
            mediaInput.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    const isVideo = file.type.startsWith('video');
                    reader.readAsDataURL(file);
                    reader.onload = function() {
                        firebase.database().ref('status_ombiri/' + currentUser).set({
                            media: reader.result,
                            mediaType: isVideo ? 'video' : 'image',
                            timestamp: Date.now()
                        });
                        alert("Story uploaded!");
                    };
                }
            };
            mediaInput.click();
        }

        function viewStatus(username, media, mediaType) {
            document.getElementById("view-status-user").innerText = username + "'s Story";
            const mediaContainer = document.getElementById("status-media-container");
            mediaContainer.innerHTML = mediaType === 'video' 
                ? `<video src="${media}" controls autoplay style="max-height:280px; width:100%; border-radius:12px;"></video>`
                : `<img src="${media}" style="max-height:280px; width:100%; object-fit:contain; border-radius:12px;">`;
            document.getElementById("status-viewer").style.display = "flex";
        }

        function closeStatusViewer() { document.getElementById("status-viewer").style.display = "none"; }

        function loadMessages() {
            firebase.database().ref('messages_ombiri').on('value', (snapshot) => {
                allMessages = [];
                snapshot.forEach((child) => {
                    allMessages.push({ id: child.key, ...child.val() });
                });
                renderMessages(allMessages);
            });
        }

        function renderMessages(msgs) {
            const container = document.getElementById("chat-messages");
            container.innerHTML = "";
            msgs.forEach((data) => {
                let match = false;
                if (currentRecipient === 'group' && data.recipient === 'group') match = true;
                else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                         (data.sender === currentRecipient && data.recipient === currentUser)) match = true;

                if (match) {
                    const isMe = data.sender === currentUser;
                    const cardClass = isMe ? "message-card me" : "message-card";
                    const imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                    const audioTag = data.audio ? `<audio src="${data.audio}" controls class="voice-player"></audio>` : "";

                    container.innerHTML += `
                        <div class="${cardClass}">
                            <img src="${data.dp || 'https://i.imgur.com/6VBx3io.png'}" class="msg-dp">
                            <div class="msg-body">
                                <div class="message-header">
                                    <span class="sender-name">${data.sender}</span>
                                    <span class="timestamp">${data.timestamp}</span>
                                </div>
                                <div class="message-text">${data.message || ""}</div>
                                ${imgTag}
                                ${audioTag}
                                <div class="msg-footer-row">
                                    <button class="delete-btn" onclick="deleteMessage('${data.id}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            scrollToBottom();
        }

        function filterMessages() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = allMessages.filter(m => (m.message && m.message.toLowerCase().includes(query)));
            renderMessages(filtered);
        }

        function scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById("chat-messages");
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById("emoji-picker");
            picker.style.display = picker.style.display === "flex" ? "none" : "flex";
        }

        function addEmoji(emoji) {
            document.getElementById("message-input").value += emoji;
            toggleEmojiPicker();
        }

        function handleTyping() {
            firebase.database().ref('typing_ombiri/' + currentUser).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                firebase.database().ref('typing_ombiri/' + currentUser).set(false);
            }, 1500);
        }

        function listenForTyping() {
            firebase.database().ref('typing_ombiri').on('value', (snapshot) => {
                const indicator = document.getElementById("typing-indicator");
                let users = [];
                snapshot.forEach((c) => {
                    if (c.key !== currentUser && c.val() === true) users.push(c.key);
                });
                indicator.innerText = users.length ? `${users.join(", ")} is typing...` : "";
            });
        }

        async function toggleVoiceRecord() {
            const micBtn = document.getElementById("mic-btn");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => { pushMessage("", null, reader.result); };
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add("recording");
                } catch (err) { alert("Microphone required!"); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove("recording");
            }
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            const text = textInput.value.trim();

            if (!text && fileInput.files.length === 0) return;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessage(text, reader.result, null);
                    fileInput.value = "";
                };
            } else {
                pushMessage(text, null, null);
            }
        }

        function pushMessage(text, image, audio) {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            firebase.database().ref('messages_ombiri').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: image,
                audio: audio,
                dp: currentDP,
                timestamp: timeStr
            });

            document.getElementById("message-input").value = "";
            firebase.database().ref('typing_ombiri/' + currentUser).set(false);
        }

        function deleteMessage(id) {
            firebase.database().ref('messages_ombiri/' + id).remove();
        }
    </script>
</body>
</html>
