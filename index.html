<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ombiri - Secure Chat</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        /* Header */
        header {
            padding: 12px 15px;
            background-color: #121212;
            border-bottom: 1px solid #222;
            text-align: center;
        }
        header h1 {
            color: #D4AF37;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }
        /* Navigation / Rooms Switcher */
        .nav-bar {
            display: flex;
            background-color: #161616;
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid #222;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .nav-btn {
            background: #222;
            color: #ccc;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .nav-btn.active {
            background: #D4AF37;
            color: #000;
            font-weight: bold;
        }
        /* Chat Messages Area */
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #000000;
        }
        .message-card {
            background-color: #121212;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            max-width: 85%;
        }
        .message-card.me {
            background-color: #1f1f1f;
            border-color: #D4AF37;
            align-self: flex-end;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .sender-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: #00adb5;
        }
        .message-card.me .sender-name {
            color: #D4AF37;
        }
        .timestamp {
            font-size: 0.7rem;
            color: #777;
        }
        .message-text {
            font-size: 0.95rem;
            color: #fff;
            word-break: break-word;
            margin-top: 2px;
        }
        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 0.75rem;
            float: right;
            margin-top: 4px;
        }
        /* Input Footer */
        .chat-footer {
            padding: 12px;
            background-color: #121212;
            border-top: 1px solid #222;
            flex-shrink: 0;
        }
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]:focus {
            border-color: #D4AF37;
        }
        .send-btn {
            background-color: #D4AF37;
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .file-upload-label {
            font-size: 0.8rem;
            color: #aaa;
            cursor: pointer;
        }
        /* Login Overlay */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: #121212;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .login-box h2 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Login Screen Overlay -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🖤 OMBIRI</h2>
            <input type="text" id="username-input" placeholder="Enter Your Name">
            <input type="password" id="password-input" placeholder="Enter Password">
            <button class="send-btn" style="padding: 12px;" onclick="handleLogin()">Enter App</button>
            <p id="login-error" style="color: #ff4b4b; font-size: 0.85rem; text-align: center;"></p>
        </div>
    </div>

    <!-- Main App Layout -->
    <div class="app-container">
        <header>
            <h1>🖤 OMBIRI</h1>
            <p id="room-subtitle" style="font-size: 0.8rem; color: #888; margin-top: 4px;">Total Chat (Team Group)</p>
        </header>

        <!-- Room Navigation Bar (Dynamic switching between Group and 1v1 chats) -->
        <div class="nav-bar" id="nav-rooms">
            <button class="nav-btn active" onclick="switchChat('group', this)">💬 Group Chat</button>
        </div>

        <!-- Chat Stream Window -->
        <div id="chat-messages"></div>

        <!-- Message Input Footer -->
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <div class="input-row">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button type="submit" class="send-btn">Send</button>
                </div>
                <input type="file" id="image-input" accept="image/*" class="file-upload-label">
            </form>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            databaseURL: "https://YOUR-FIREBASE-APP-DEFAULT-RDB.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = localStorage.getItem("ombiri_user") || "";
        let currentRecipient = "group";

        if (currentUser) {
            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function handleLogin() {
            const name = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            const errorElement = document.getElementById("login-error");

            if (pass !== "162012") {
                errorElement.innerText = "Incorrect Password!";
                return;
            }
            if (!name) {
                errorElement.innerText = "Please enter your name!";
                return;
            }

            localStorage.setItem("ombiri_user", name);
            currentUser = name;
            
            // Register user in Firebase database automatically
            firebase.database().ref('users/' + name).set({ name: name });

            document.getElementById("login-screen").style.display = "none";
            initChat();
        }

        function switchChat(recipient, btnElement) {
            currentRecipient = recipient;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const subtitle = recipient === 'group' ? "Total Chat (Team Group)" : `1v1 Chat with ${recipient}`;
            document.getElementById("room-subtitle").innerText = subtitle;
            loadMessages();
        }

        function initChat() {
            loadUsersAndRooms();
            loadMessages();
        }

        function loadUsersAndRooms() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const navBar = document.getElementById("nav-rooms");
                navBar.innerHTML = `<button class="nav-btn ${currentRecipient === 'group' ? 'active' : ''}" onclick="switchChat('group', this)">💬 Group Chat</button>`;
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user.name !== currentUser) {
                        const isActive = currentRecipient === user.name ? 'active' : '';
                        navBar.innerHTML += `<button class="nav-btn ${isActive}" onclick="switchChat('${user.name}', this)">👤 ${user.name}</button>`;
                    }
                });
            });
        }

        function loadMessages() {
            const dbRef = firebase.database().ref('messages');
            const container = document.getElementById("chat-messages");
            
            dbRef.on('value', (snapshot) => {
                container.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgId = childSnapshot.key;
                    
                    let match = false;
                    if (currentRecipient === 'group' && data.recipient === 'group') {
                        match = true;
                    } else if ((data.sender === currentUser && data.recipient === currentRecipient) ||
                               (data.sender === currentRecipient && data.recipient === currentUser)) {
                        match = true;
                    }

                    if (match) {
                        const isMe = data.sender === currentUser;
                        const cardClass = isMe ? "message-card me" : "message-card";
                        
                        let imgTag = data.image ? `<img src="${data.image}" class="message-image">` : "";
                        
                        let html = `
                            <div class="${cardClass}">
                                <div class="message-header">
                                    <span class="sender-name">${data.sender}</span>
                                    <span class="timestamp">${data.timestamp}</span>
                                </div>
                                <div class="message-text">${data.message || ""}</div>
                                ${imgTag}
                                <button class="delete-btn" onclick="deleteMessage('${msgId}')">Delete 🗑️</button>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const fileInput = document.getElementById("image-input");
            
            const text = textInput.value.trim();
            if (!text && fileInput.files.length === 0) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = function() {
                    pushMessageData(text, reader.result, timeStr);
                    fileInput.value = "";
                };
            } else {
                pushMessageData(text, null, timeStr);
            }
        }

        function pushMessageData(text, imageBase64, timestamp) {
            firebase.database().ref('messages').push({
                sender: currentUser,
                recipient: currentRecipient,
                message: text,
                image: imageBase64,
                timestamp: timestamp
            });
            document.getElementById("message-input").value = "";
        }

        function deleteMessage(id) {
            firebase.database().ref('messages/' + id).remove();
        }
    </script>
</body>
</html>
