<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMBIRI // SECURE CHAT</title>
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(8, 20, 40, 0.85);
            --border: rgba(0, 240, 255, 0.25);
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.1);
            --white: #f8fafc;
            --text-dim: #64748b;
            --bubble-sent: rgba(0, 240, 255, 0.15);
            --bubble-recv: rgba(15, 23, 42, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Tactical Background Subgrid */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.06) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            z-index: 1;
            pointer-events: none;
        }

        /* Chat Header */
        .chat-header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            backdrop-filter: blur(12px);
        }

        .chat-identity h1 {
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--cyan);
            font-weight: 700;
        }

        .chat-identity span {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .secure-badge {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--cyan);
            background: var(--cyan-dim);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* Message Display Window */
        .chat-window {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: break-word;
            animation: fadeIn 0.2s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            background: var(--bubble-sent);
            border: 1px solid var(--border);
            color: var(--white);
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bubble-recv);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: var(--white);
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 0.5rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-align: right;
            letter-spacing: 0.5px;
        }

        /* Input Panel Footer */
        .chat-footer {
            position: relative;
            z-index: 10;
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(12px);
        }

        .chat-input {
            flex: 1;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--white);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .send-btn {
            background: var(--cyan-dim);
            border: 1px solid var(--border);
            color: var(--cyan);
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:active {
            background: var(--cyan);
            color: var(--bg);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="chat-header">
        <div class="chat-identity">
            <h1>OMBIRI // NODE</h1>
            <span>LOCAL SECURE REPOSITORY</span>
        </div>
        <div class="secure-badge">ENCRYPTED</div>
    </header>

    <!-- MESSAGES AREA -->
    <div class="chat-window" id="chatWindow">
        <div class="message received">
            OMBIRI secure protocol established. Ready for transmission, Boss.
            <div class="msg-time">SYSTEM</div>
        </div>
    </div>

    <!-- INPUT BAR -->
    <footer class="chat-footer">
        <input type="text" id="msgInput" class="chat-input" placeholder="Type secure message..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">SEND</button>
    </footer>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const msgInput = document.getElementById('msgInput');

        // Load saved messages from Local Storage to prevent data loss
        document.addEventListener("DOMContentLoaded", () => {
            const savedLogs = localStorage.getItem('ombiri_chat_logs');
            if (savedLogs) {
                chatWindow.innerHTML = savedLogs;
                scrollToBottom();
            }
        });

        // Haptic feedback support
        function triggerHaptic() {
            if ("vibrate" in navigator) navigator.vibrate(15);
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            triggerHaptic();

            // Append Sent Message
            const sentDiv = document.createElement('div');
            sentDiv.className = 'message sent';
            sentDiv.innerHTML = `${escapeHTML(text)}<div class="msg-time">${getCurrentTime()}</div>`;
            chatWindow.appendChild(sentDiv);

            msgInput.value = '';
            scrollToBottom();
            saveChatState();

            // Simulated automated response reply for testing node loop
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message received';
                replyDiv.innerHTML = `ACK: Received [${text}]<div class="msg-time">${getCurrentTime()}</div>`;
                chatWindow.appendChild(replyDiv);
                scrollToBottom();
                saveChatState();
            }, 600);
        }

        // Allow sending via Enter key
        msgInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function saveChatState() {
            localStorage.setItem('ombiri_chat_logs', chatWindow.innerHTML);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
