<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombiri - Black & Gold Chat</title>
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #AA7C11;
            --black: #0A0A0A;
            --dark-grey: #1A1A1A;
            --light-grey: #2A2A2A;
            --text-gold: #F3E5AB;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--black);
            color: var(--text-gold);
            display: flex; height: 100vh; overflow: hidden;
        }
        .login-container, .app-container {
            display: flex; width: 100vw; height: 100vh;
        }
        .login-card {
            margin: auto; background: var(--dark-grey);
            border: 2px solid var(--gold); padding: 30px;
            border-radius: 12px; text-align: center; width: 300px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .login-card h2 { color: var(--gold); margin-bottom: 5px; }
        .credits { font-size: 0.85rem; color: var(--dark-gold); margin-bottom: 20px; font-weight: bold; }
        .login-card input {
            width: 90%; padding: 10px; margin: 8px 0;
            background: var(--light-grey); border: 1px solid var(--gold);
            color: #fff; border-radius: 6px;
        }
        .btn {
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: black; border: none; padding: 10px 20px;
            font-weight: bold; cursor: pointer; border-radius: 6px; width: 95%; margin-top: 10px;
        }
        .btn-wa { background: #25D366; color: white; margin-top: 8px; }
        
        .sidebar {
            width: 280px; background: var(--dark-grey);
            border-right: 1px solid var(--gold); display: flex; flex-direction: column;
        }
        .header { padding: 15px; background: var(--black); border-bottom: 1px solid var(--gold); text-align: center; }
        .header h3 { margin: 0; color: var(--gold); }
        .member-list { overflow-y: auto; flex: 1; }
        .member-item {
            display: flex; align-items: center; padding: 10px 15px;
            border-bottom: 1px solid #333; cursor: pointer;
        }
        .member-item:hover, .member-item.active { background: var(--light-grey); border-left: 4px solid var(--gold); }
        .dp { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold); margin-right: 12px; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--black); }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble {
            max-width: 60%; padding: 10px 14px; border-radius: 12px;
            background: var(--dark-grey); border: 1px solid var(--gold); color: #fff;
        }
        .message-bubble.self { align-self: flex-end; background: var(--dark-gold); color: black; font-weight: 500; }
        .input-bar {
            padding: 12px; background: var(--dark-grey); border-top: 1px solid var(--gold);
            display: flex; align-items: center; gap: 10px;
        }
        .input-bar input[type="text"] {
            flex: 1; padding: 10px; background: var(--black); border: 1px solid var(--gold); color: #fff; border-radius: 6px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h2>Ombiri</h2>
            <div class="credits">Made by Armaan</div>
            <p id="errorMsg" style="color:red; font-size:0.8rem; display:none;">Incorrect Password! Use 123456</p>
            <input type="text" id="userInput" placeholder="Username"><br>
            <input type="password" id="passInput" placeholder="Password (123456)"><br>
            <button class="btn" onclick="login()">Login</button>
            <button class="btn btn-wa" onclick="waLogin()">Login with WhatsApp</button>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chatScreen" class="app-container hidden">
        <div class="sidebar">
            <div class="header">
                <h3>Ombiri Chat</h3>
                <div class="credits">Made by Armaan</div>
            </div>
            <div class="member-list" id="memberList">
                <!-- 16 Candidates will load here -->
            </div>
        </div>
        <div class="chat-area">
            <div class="header" style="text-align: left; padding-left: 20px;">
                <h4 id="roomTitle" style="margin: 0; color: var(--gold);">Global Group</h4>
            </div>
            <div class="messages" id="messageContainer"></div>
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn" style="width: auto;" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentUsername = "";
        let currentRoom = "Global Group";
        const chats = { "Global Group": [] };

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if(pass === "123456" && user.trim() !== "") {
                currentUsername = user;
                startApp();
            } else {
                document.getElementById('errorMsg').style.display = "block";
            }
        }

        function waLogin() {
            currentUsername = "WhatsApp_User";
            startApp();
        }

        function startApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            loadCandidates();
        }

        function loadCandidates() {
            const list = document.getElementById('memberList');
            list.innerHTML = `<div class="member-item active" onclick="switchRoom('Global Group', this)">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Global" class="dp">
                <div><strong>Global Group</strong></div>
            </div>`;
            
            for(let i=1; i<=16; i++) {
                let name = `Candidate ${i}`;
                chats[name] = [];
                list.innerHTML += `<div class="member-item" onclick="switchRoom('${name}', this)">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${name}" class="dp">
                    <div><strong>${name}</strong><br><small style="color:green;">● Online</small></div>
                </div>`;
            }
            switchRoom('Global Group', list.children[0]);
        }

        function switchRoom(roomName, element) {
            currentRoom = roomName;
            document.getElementById('roomTitle').innerText = roomName;
            document.querySelectorAll('.member-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderMessages();
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            
            chats[currentRoom].push({ sender: currentUsername, text: input.value });
            input.value = "";
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messageContainer');
            container.innerHTML = "";
            chats[currentRoom].forEach(msg => {
                const div = document.createElement('div');
                div.className = "message-bubble " + (msg.sender === currentUsername ? "self" : "");
                div.innerHTML = `<strong>${msg.sender}</strong><br>${msg.text}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
